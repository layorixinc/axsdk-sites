            site: { type: string, enum: [amazon, walmart, ebay, aliexpress, etsy, coupang, naver-shopping, gmarket, 11st, ssg] }
        index: { type: number }
        key: { type: string }
        context: { type: object, additionalProperties: true }

  shopping_search_one_store:
    description: Search one mapped store with a runtime-side script that drives the page over RPC.
    execute:
      kind: runtime
      implementation: lua
      modules: ["_common.61_rpc_storefront", "_common.62_rpc_sites"]
      rpc:
        # Read-only. No write op is reachable from this tool, and the audit in `check:flows` fails the
        # build if the script ever calls one that is not listed here.
        allow: [nav.navigate, dom.get_location_href, dom.exists, dom.query_all, dom.get_text]
        # A navigating script must keep this LOW. A document that accepts a poll and then unloads is
        # indistinguishable from a slow one, so the runtime waits out the whole op timeout: measured
        # 8000 → over 260s for one search, 2000 → 30s.
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_STOREFRONT.run_store_search(args)
        end
    input:
      site: tool.args.item.site
      # The collector may hand back the wording this store's own listings use; until then the shared query stands.
      query: { if: [{ var: tool.args.query }, { var: tool.args.query }, { var: tool.args.context.query }] }
      quantity: tool.args.context.quantity
      purpose: { if: [{ var: tool.args.context.discovery_query }, "discovery", "comparison"] }
      requested_brand: tool.args.context.requested_brand
      identity_brand: tool.args.context.identity_brand
      identity_model: tool.args.context.identity_model
      product_category: tool.args.context.product_category
      hard_constraints: tool.args.context.locked_hard_constraints
      page: tool.args.page
    output:
      # No `navigating`: the script keeps its own stack across the reload, so there is nothing to resume.
      next: result.next
      store_result: result.store_result
    parameters:
      type: object
      additionalProperties: false
      required: [item, index, key, context]
      properties:
        item:
          type: object
          additionalProperties: false
          required: [site]
          properties:
            site: { type: string, enum: [amazon, walmart, ebay, aliexpress, etsy, coupang, naver-shopping, gmarket, 11st, ssg] }
        index: { type: number }
        key: { type: string }
        context:
          type: object
          additionalProperties: true
          required: [query]
          properties:
            query: { type: string }
            quantity: { type: [integer, number] }
        page: { type: [integer, number] }

