            value deletes.
          additionalProperties: { type: string }

  present_memory_result:
    description: Render one memory result as localized consumer text without exposing the wire envelope.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.present(args)
        end
    output:
      next: result.next
      memory_response: result.memory_response
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [ string, "null" ] }
        userMessages:
          type: [ array, "null" ]
          items: { type: string }
        memory_result:
          type: [ object, boolean, "null" ]
          additionalProperties: true
        operation: { type: [ string, "null" ] }
        confirmed: { type: [ boolean, "null" ] }
        key: { type: [ string, "null" ] }
        regex: { type: [ string, "null" ] }
        memory:
          type: [ object, "null" ]
          additionalProperties: { type: string }
        delete_keys:
          type: [ array, "null" ]
          items: { type: string }

  present_quote_collection:
    description: Present one quote-collection question and pause until the user answers it.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function current_text()
          local messages = args.userMessages
          if type(messages) == "table" then
            for index = #messages, 1, -1 do
              if type(messages[index]) == "string" and messages[index] ~= "" then return messages[index] end
            end
          end
          return type(args.requestText) == "string" and args.requestText or ""
        end
        local function is_cancel(text)
          local lowered = tostring(text or ""):lower():gsub("^%s+", ""):gsub("%s+$", "")
          local words = {
            "취소", "그만", "됐어", "됐습니다", "안 할래", "안할래", "관두",
            "cancel", "never mind", "nevermind", "no thanks", "stop"
          }
          for index = 1, #words do
            if lowered:find(words[index], 1, true) then return true end
          end
          return false
        end
        if args.collect_stage == "asked" then
          if is_cancel(current_text()) then return { next = "cancel" } end
          return { next = "resume" }
        end
        local question = type(args.question) == "string" and args.question or ""
        if question == "" then return { next = "error" } end
        return { next = "ask", question = question, collect_stage = "asked" }
    output:
      next: result.next
      question: result.question
      collect_stage: result.collect_stage
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [ string, "null" ] }
        userMessages: { type: [ array, "null" ], items: { type: string } }
        question: { type: [ string, "null" ] }
        collect_stage: { type: [ string, "null" ] }

  collect_quote_service:
    description: Scan the complete latest user message for a named service and any
      work scope or timing before asking. For example, "핸디맨으로 작은 집 청소, 48시간 내
      일회성" is a complete handyman service stage.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local service = clean(args.service_query)
        local requirements = clean(args.user_requirements)
        local out = {
          next = "collect",
          service_query = service,
          user_requirements = requirements,
        }
        if not service or not requirements then
          out.question = clean(args.question)
          if out.question then out.next = "ask" end
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [ question, service_query, user_requirements ]
      properties:
        question: { type: [ string, "null" ] }
        service_query: { type: [ string, "null" ], minLength: 1 }
        user_requirements: { type: [ string, "null" ], minLength: 1 }

  collect_quote_location:
    description: Copy an explicit five-digit token from the complete latest user
      message as the ZIP; otherwise translate its US city/address to English.
      "샌프란시스코에서" must produce address "San Francisco, CA", not a question.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local address = clean(args.address)
        local zip = clean(args.zip_code)
        local out = { next = "collect", address = address, zip_code = zip }
        if not address and not zip then
          out.question = clean(args.question)
          if out.question then out.next = "ask" end
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [ question, address, zip_code ]
      properties:
        question: { type: [ string, "null" ] }
        address: { type: [ string, "null" ], minLength: 1 }
        zip_code: { type: [ string, "null" ], pattern: "^[0-9]{5}$" }

  collect_quote_location_retry:
    description: Ask for and collect a replacement location after ZIP resolution fails.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end

          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local address = clean(args.address)
        local zip = clean(args.zip_code)
        local status = clean(args.zip_status)
        local out = { next = "collect", address = address, zip_code = zip }
        if zip or (address and not status) then
          out.zip_status = nil
        else
          out.zip_status = status or "resolve_failed"
          out.question = clean(args.question)
          if out.question then out.next = "ask" end
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [ question, address, zip_code, zip_status ]
      properties:
        question: { type: [ string, "null" ] }
        address: { type: [ string, "null" ], minLength: 1 }
        zip_code: { type: [ string, "null" ], pattern: "^[0-9]{5}$" }
        zip_status: { type: [ string, "null" ] }

  collect_quote_contact:
    description: Extract every supplied first name, last name, email, and phone from
      the complete latest user message, then ask for all still-missing contacts
      in the user's language. For Korean input ask in Korean, for example "이름,
      성, 이메일, 전화번호를 알려주세요."
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local phone = clean(args.submit_phone)
        local email = clean(args.submit_email)
        local first_name = clean(args.submit_first_name)
        local last_name = clean(args.submit_last_name)
        local out = {
          next = "collect",
          submit_phone = phone,
          submit_email = email,
          submit_first_name = first_name,
          submit_last_name = last_name,
        }
        if not phone or not email or not first_name or not last_name then
          out.question = clean(args.question)
          if out.question then out.next = "ask" end
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required:
        [
          question,
          submit_phone,
          submit_email,
          submit_first_name,
          submit_last_name
        ]
      properties:
        question: { type: [ string, "null" ] }
        submit_phone: { type: [ string, "null" ], minLength: 1 }
        submit_email: { type: [ string, "null" ], minLength: 1 }
        submit_first_name: { type: [ string, "null" ], minLength: 1 }
        submit_last_name: { type: [ string, "null" ], minLength: 1 }

  finish_quote_request:
    description: Finish collection after every required quote-request field is present.
    execute: passthrough
    output:
      next: done
      question: null
    parameters:
      type: object
      additionalProperties: false
      properties: {}

  confirm_quote_decision:
    description: Classify the current quote approval reply without model judgement.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function current_text()
          local messages = args.userMessages
          if type(messages) == "table" then
            for index = #messages, 1, -1 do
              if type(messages[index]) == "string" and messages[index] ~= "" then return messages[index] end
            end
          end
          return type(args.requestText) == "string" and args.requestText or ""
        end
        if args.quote_confirm_stage ~= "asked" then return { next = "error" } end
        local text = current_text():lower():gsub("^%s+", ""):gsub("%s+$", "")
        local cancellations = {
          "아니요", "아니", "취소", "그만", "됐어", "안 할래", "안할래",
          "cancel", "never mind", "nevermind", "no thanks", "stop"
        }
        for index = 1, #cancellations do
          if text:find(cancellations[index], 1, true) then return { next = "cancel" } end
        end
        local approvals = {
          "예", "네", "응", "좋아", "진행", "요청해", "yes", "yep", "go ahead", "proceed", "do it"
        }
        for index = 1, #approvals do
          if text:find(approvals[index], 1, true) then return { next = "proceed" } end
        end
        return { next = "refine" }
    output:
      next: result.next
      refine_stage: result.refine_stage
      quote_confirm_stage: result.quote_confirm_stage
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [ string, "null" ] }
        userMessages: { type: [ array, "null" ], items: { type: string } }
        quote_confirm_stage: { type: [ string, "null" ] }

  followup_decision:
    description: After reporting quote outcomes, choose whether to request more
      quotes from the current results, start a new service request, or finish —
      carrying any state reset needed.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [ next ]
      properties:
        next: { type: string, enum: [ ask, more, new, done ] }
        question: { type: string }
        message: { type: string }
        refine_stage: { type: [ string, "null" ] }
        refine_selected: { type: [ array, "null" ] }
        service_query: { type: [ string, "null" ] }
        user_requirements: { type: [ string, "null" ] }
        quote_results: { type: [ string, "null" ] }
        followup_stage: { type: [ string, "null" ] }

  collect_shopping:
    description: Fill the shopping list (shop_plan — an array of { query, quantity
      }) and choose the next step (ask the user to clarify, or finish).
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [ next ]
      properties:
        next: { type: string, enum: [ ask, done, cancel ] }
        question: { type: string }
        shop_plan:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              query: { type: string }
              quantity: { type: [ integer, number ] }
        # A store the user NAMED; nullable, because an invalid tool call kills the shopping list.
        site: { type: [ string, "null" ], enum: [ amazon, ebay, walmart, aliexpress, etsy, coupang, 11st, gmarket, ssg, naver-shopping, null ] }
        message: { type: string }





  community_classify:
    description: Decide, without a model, whether the user named a community command
      this page offers. Names only; the values come next.
    # The catalog arrives as a Lua global, not an argument: the runtime strips context keys from args
    # on purpose, so a copy in `parameters` would be the same fact under two names with no write path.
    contextAccess:
      read: [ community ]
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.69_rpc_widget", "_common.75_rpc_community" ]
      rpc:
        allow: [ dom.get_location_href ]
        opTimeoutMs: 2000
        deadlineMs: 15000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_COMMUNITY.classify(args)
        end
    output:
      next: result.next
      named_command: result.command
      candidates: result.candidates
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [ string, "null" ] }
  community_propose:
    description: Propose one community command for the user to run, with the values
      it should carry. Renders nothing and runs nothing — the user presses a button,
      and the extension checks everything again before it does.
    # The catalog names the script, the version and the effect of every command it offers, so the
    # model is asked for neither: a second writer of one fact is right by luck or not at all, and
    # live it answered an effect outside the vocabulary.
    contextAccess:
      read: [ community ]
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.69_rpc_widget", "_common.75_rpc_community" ]
      # Validates and hands fields to state. No page, no network, no memory; the compiler refuses
      # an empty allow, so it names one op it never calls.
      rpc:
        allow: [ dom.get_location_href ]
        opTimeoutMs: 2000
        deadlineMs: 15000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_COMMUNITY.propose(args)
        end
    output:
      next: { if: [ { var: result.error }, "error", "confirm" ] }
      script_id: result.script_id
      script_name: result.script_name
      publisher_id: result.publisher_id
      version: result.version
      command: result.command
      description: result.description
      effect: result.effect
      arguments_json: result.arguments_json
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [ command ]
      properties:
        command: { type: string }
        arguments_json: { type: string }
  community_confirm:
    description: Render the confirm button for a community command the model proposed,
      plus the sentence beside it naming the script, the publisher, the effect and
      the values. Renders only; the click is the user's and the broker re-checks it.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.69_rpc_widget", "_common.75_rpc_community" ]
      # No page, no network, no memory: this builds a block of text. A grant it does not need is a
      # grant a future edit could quietly use, and the compiler refuses an empty `allow`.
      rpc:
        allow: [ dom.get_location_href ]
        opTimeoutMs: 2000
        deadlineMs: 15000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_COMMUNITY.confirm(args)
        end
    output:
      next: { if: [ { var: result.error }, "error", "confirm" ] }
      community_widget: result.widget
      community_summary: result.summary
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [ script_id, version, command, effect ]
      properties:
        script_id: { type: string }
        script_name: { type: string }
        publisher_id: { type: string }
        version: { type: string }
        command: { type: string }
        description: { type: string }
        effect: { type: string }
        # A string, not an object: flow state carries scalars reliably, and an empty Lua table
        # encodes as an object that the extension's argument parser then refuses.
        arguments_json: { type: string }

  # A runtime tool is INLINED by the flow that names it, and an inline action cannot be shared: three
  # flows on one entry tool compile to "inline action duplicates existing action", and `run:` resolves
  # only against `kind: remote`. Hence one thin entry per flow (AGENTS.md §13).
  enter_shopping_site:
    description: Resolve the store this turn shops on — named, else already open, else default — get
      the browser onto it, and confirm it arrived.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.62_rpc_sites", "_common.66_rpc_navigate" ]
      rpc:
        allow: [ dom.get_location_href, nav.navigate ]
        opTimeoutMs: 2000
        deadlineMs: 60000
      entry: run
      lua: |
        function run(args)
          -- `args.site = args.site or "amazon"` used to sit here, and nothing ever set the left side: the
          -- flow's own state was seeded `amazon`, so a user standing on their store was navigated away
          -- from it and shopped on amazon instead. The searching and cart readers already derive their
          -- adapter from the open page; the opener was the one place that decided otherwise.
          -- `AX_RPC_NAV.resolve_site` owns the order of evidence and publishes which source decided.
          return AX_RPC_NAV.open_site(type(args) == "table" and args or {})
        end
    output:
      next: result.next
      error: result.error
      site: result.site
      site_source: result.site_source
      page_href: result.href
    parameters:
      type: object
      additionalProperties: false
      properties:
        # Nullable: `null` against `{type: string}` is refused before the script runs (AGENTS.md §13).
        site: { type: [ string, "null" ] }

  enter_checkout_site:
    description: Get the browser onto the store whose cart is being reviewed — the one already open,
      since that is where the items were added — and confirm it arrived.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.62_rpc_sites", "_common.66_rpc_navigate" ]
      rpc:
        allow: [ dom.get_location_href, nav.navigate ]
        opTimeoutMs: 2000
        deadlineMs: 60000
      entry: run
      lua: |
        function run(args)
          -- A forced amazon default sent a coupang shopper's checkout to amazon's cart.
          return AX_RPC_NAV.open_site(type(args) == "table" and args or {})
        end
    output:
      next: result.next
      error: result.error
      site: result.site
      page_href: result.href
    parameters:
      type: object
      additionalProperties: false
      properties:
        site: { type: [ string, "null" ] }



  next_product:
    description: Record the item just processed into shop_results and pick the next
      item from shop_plan (sets query/quantity, advances shop_index). No LLM, no
      navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local plan = args.shop_plan or {}
        local idx = args.shop_index or 0
        local results = args.shop_results or ""
        local function nz(v) if v == nil or v == "" then return nil end return v end
        if idx > 0 then
          local prev = plan[idx] or {}
          local q = tostring(prev.query or "?")
          local qty = prev.quantity or 1
          local outcome
          if args.add_status == "added" then
            outcome = "added (x" .. tostring(qty) .. ")" .. (nz(args.product_name) and (" - " .. tostring(args.product_name)) or "")
          elseif args.add_status == "pending" then
            outcome = "add pending (x" .. tostring(qty) .. ")"
          elseif nz(args.add_error) then
            outcome = "NOT added (" .. tostring(args.add_error) .. ")"
          elseif nz(args.search_status) and args.search_status ~= "ok"
            and args.search_status ~= "no_results" then
            -- The store REFUSED to be searched (bot wall, login, dead channel). Live, coupang's 403 page
            -- reached the user as "찾지 못했다" — a claim about listings nobody was shown, one level up from
            -- the reader that had the same bug. A refusal the user can act on has to survive to the reply.
            outcome = "store refused (" .. tostring(args.search_status) .. ")"
          elseif not nz(args.product_id) then
            outcome = "no product found"
          else
            outcome = "skipped"
          end
          results = (results ~= "" and (results .. "\n") or "") .. q .. ": " .. outcome
        end
        if idx < #plan then
          local item = plan[idx + 1] or {}
          return {
            next = "shop",
            query = item.query,
            -- The other spellings ride with the item: a store searched in the wrong language finds
            -- nothing (measured on coupang), and the reader retries only then.
            query_variants = item.query_variants or "",
            quantity = item.quantity or 1,
            shop_index = idx + 1,
            shop_results = results,
            search_status = "",
            product_id = "",
            product_name = "",
            add_status = "",
            add_error = "",
            shop_refine_stage = "",
          }
        end
        return { next = "done", shop_index = idx, shop_results = results, shop_count = idx }
    parameters:
      type: object
      additionalProperties: true
      properties:
        shop_plan: { type: [ array, "null" ] }
        shop_index: { type: [ integer, "null" ] }
        shop_results: { type: [ string, "null" ] }
        product_id: { type: [ string, "null" ] }
        product_name: { type: [ string, "null" ] }
        add_status: { type: [ string, "null" ] }
        add_error: { type: [ string, "null" ] }
        # Undeclared is DROPPED before the script sees it, so a refusal the reader classified would
        # arrive as nil and the item would be recorded as "no product found".
        search_status: { type: [ string, "null" ] }

  shopping_search_product:
    description: Search the shopping site for the current item's query; returns
      candidate products.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.61_rpc_storefront", "_common.62_rpc_sites" ]
      rpc:
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.query_all,
            dom.get_text
          ]
        opTimeoutMs: 2000
        deadlineMs: 90000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_STOREFRONT.run_open_site_search(args)
        end
    output:
      # The script already chose its branch; deriving one from `result.error` here overrode it and sent
      # an unported store to `next_product` instead of to the durable sibling.
      next: result.next
      candidates: result.candidates
      search_status: { if: [ { var: result.error }, { var: result.error }, "ok" ] }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [ query ]
      properties:
        query: { type: string }
        # Other spellings of the SAME product, "|"-separated, at most three. Tried only when the store
        # found nothing, so they cost no page load when the first term works — and a store that refused
        # (wall, login) is never asked again, because no wall opens for a synonym.
        query_variants: { type: [ string, "null" ] }

  pick_product:
    description: Pick the first usable search candidate to add to the cart. No LLM,
      no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local cands = args.candidates or {}
        for i = 1, #cands do
          local c = cands[i] or {}
          local id = c.id
          if id ~= nil and id ~= "" then
            return { next = "add", product_id = id, product_name = c.name or c.title }
          end
        end
        return { next = "skip", product_id = "", product_name = "" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        candidates: { type: [ array, "null" ] }

  cart_open_lines:
    description: Read the cart of the store the user is on and carry its lines to the
      turn that shows them. Touches nothing.
    execute:
      kind: runtime
      implementation: lua
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.62_rpc_sites",
          "_common.67_rpc_cart",
          "_common.74_rpc_cart_view"
        ]
      rpc:
        allow: [ nav.navigate, dom.get_location_href, dom.exists, dom.get_text, dom.query_all ]
        opTimeoutMs: 2000
        deadlineMs: 60000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CART_VIEW.open(args)
        end
    output:
      next: result.next
      site: result.site
      cart_count: result.cart_count
      cart_state: result.cart_state
      remove_error: result.error
      remove_status: result.status
    parameters:
      type: object
      additionalProperties: false
      required: []
      properties:
        site: { type: [ string, "null" ] }
  cart_present_lines:
    description: Render the cart's lines as one numbered window, pause on it, and read
      the user's answer deterministically.
    execute:
      kind: runtime
      implementation: lua
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.62_rpc_sites",
          "_common.67_rpc_cart",
          "_common.74_rpc_cart_view"
        ]
      rpc:
        # Rendering and classifying a reply touch no page. The compiler refuses an empty allow-list, so
        # this names the cheapest read there is and the script never calls it.
        allow: [ dom.get_location_href ]
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CART_VIEW.present(args)
        end
    output:
      next: result.next
      question: result.question
      choice_stage: result.choice_stage
      cart_state: result.cart_state
      cart_count: result.cart_count
      site: result.site
      product_id: result.product_id
      product_title: result.product_title
      # The marker the mutation requires, written by the turn the user chose in.
      cart_approval: result.cart_approval
      remove_error: result.error
    parameters:
      type: object
      additionalProperties: false
      # Nothing is required: this is projected from flow state and the first pass has no reply at all. A
      # required key state does not carry is REJECTED before the script runs.
      required: []
      properties:
        # UNDECLARED IS DROPPED: selected but never declared, "취소" never reaches the script.
        requestText: { type: [ string, "null" ] }
        userMessages: { type: [ array, "null" ], items: { type: string } }
        cart_state: { type: [ string, "null" ] }
        choice_stage: { type: [ string, "null" ] }
  cart_remove_line:
    description: Remove ONE approved line from the cart. Never adds, never enters
      checkout, never places an order.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.62_rpc_sites", "_common.67_rpc_cart" ]
      rpc:
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.get_text,
            dom.get_attr,
            dom.click
          ]
        opTimeoutMs: 2000
        deadlineMs: 60000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CART.remove_from_cart(args)
        end
    output:
      next: result.next
      site: result.site
      cart_count: result.cart_count
      remove_status: { if: [ { var: result.removed }, "removed", { var: result.status } ] }
      remove_error: result.error
    effect: mutation
    consent: required
    idempotent: true
    # The gate is `present`, where the user picked THIS line out of the cart's own listing. The platform
    # refuses a mutation adapter with no `require`, and this one is SATISFIABLE because the value is a
    # literal that gate writes into state — never `{ product_id: true }`, which compares by EQUALITY and
    # demands the id BE the boolean true (§13).
    require: { cart_approval: user_confirmed_removal }
    parameters:
      type: object
      additionalProperties: false
      required: [ product_id ]
      properties:
        site: { type: [ string, "null" ] }
        product_id: { type: string }
        cart_approval: { type: string, enum: [ user_confirmed_removal ] }
  shopping_add_to_cart:
    description: Add the picked product to the cart with the requested quantity.
      Navigates to the product page, revalidates the price, clicks Add to Cart,
      declines the optional protection plan, and reads the confirmation. Never
      places an order.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.61_rpc_storefront", "_common.62_rpc_sites", "_common.67_rpc_cart" ]
      rpc:
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.get_text,
            dom.get_attr,
            dom.click,
            dom.set_value
          ]
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          args = type(args) == "table" and args or {}
          -- The gate for this flow is `refine_item`, where the user picked THIS product out of the searched
          -- list. Naming it here is what lets the shared cart refuse a call that carries no approval at all
          -- while still serving a flow that has no comparison to approve.
          --
          -- `args.site = args.site or "amazon"` used to sit here. `site` is not declared below and
          -- `additionalProperties: false`, so the left side was ALWAYS nil: the fallback always fired and the
          -- adapter was guaranteed by the projection rather than decided. The cart derives the store from the
          -- open page now, and an unported host refuses instead of borrowing amazon's selectors.
          return AX_RPC_CART.add_to_cart(args)
        end
    output:
      next: result.next
      add_status: { if: [ { var: result.added }, "added", "failed" ] }
      add_error: result.error
      add_confirmation: result.confirmation
      # WHERE it stopped. `add_to_cart_pending` answers for four facts (control never found, click refused,
      # click landed and the store's counter never moved, counter moved and the cart never named the line),
      # and live that was all a failing add could say about a store where a plain click on the same button
      # lands the item every time (`TODO.md` §19).
      add_stage: result.stage
    effect: mutation
    consent: required
    idempotent: true
    # No `require:` here on purpose. It compares an argument to the value given BY EQUALITY, so the
    # `{ product_id: true }` that stood here demanded the id BE the boolean true — `"B0F34DXKZH" ~= true` — and
    # the single-site cart add could never succeed: live it answered `adapter requirement failed: product_id`
    # with the id sitting in the node's selected state, and a probe inside the tool never ran, because the
    # requirement is checked before the script. Presence is what `parameters.required` below states. The
    # approval this mutation carries is the flow's own gate, `refine_item`, which the entry Lua names as
    # `cart_approval = "user_picked_searched_product"` for the shared cart to accept.
    # The platform refuses a mutation adapter with no `require`, and this one is SATISFIABLE because the
    # value is a literal the gate writes into state. What stood here was `{ product_id: true }`, which
    # compares by equality and so demanded the id BE the boolean true — the single-site cart add could never
    # succeed, and live it answered `adapter requirement failed: product_id` with the id sitting in the
    # node's selected state. Mirrors `shopping_add_selected_store_offer`, which adds to a real cart.
    require: { cart_approval: user_picked_searched_product }
    parameters:
      type: object
      additionalProperties: false
      required: [ product_id ]
      properties:
        product_id: { type: string }
        quantity: { type: [ integer, number, string ] }
        cart_approval: { type: string, enum: [ user_picked_searched_product ] }

  refine_products:
    description: Refine the searched products for the current item — ask the user
      which product / how to narrow, or (after they answer) record the chosen
      product to add, or skip. The LLM ranks/filters the candidates; this tool
      captures the decision.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [ next ]
      properties:
        next: { type: string, enum: [ ask, pick, skip, cancel ] }
        question: { type: string }
        shop_refine_stage: { type: [ string, "null" ] }
        product_id: { type: [ string, "null" ] }
        product_name: { type: [ string, "null" ] }
        cart_approval: { type: string, enum: [ user_picked_searched_product ] }
        message: { type: string }

  checkout_decision:
    description: Record the user's checkout approval decision after items are in the
      cart — proceed to the checkout page (no order placed), finish without
      checkout, or keep asking.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [ next ]
      properties:
        next: { type: string, enum: [ ask, checkout, done, cancel ] }
        question: { type: string }
        checkout_stage: { type: [ string, "null" ] }
        message: { type: string }

  checkout:
    description: Navigate to the cart and open the checkout REVIEW page so the user
      can read the order total, address and payment method. Never places an
      order.
    execute:
      kind: runtime
      implementation: lua
      # Its own module, so the cart's stays provably order-free: `check:flows` asserts the cart code
      # contains no checkout or order words, which only holds while the checkout lives elsewhere.
      modules:
        [
          "_common.61_rpc_storefront",
          "_common.62_rpc_sites",
          "_common.68_rpc_checkout"
        ]
      rpc:
        # No form submit and nothing that could place an order — the place-order button is READ, to report
        # whether it is there, and never clicked.
        allow: [ nav.navigate, dom.get_location_href, dom.exists, dom.get_text, dom.click ]
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CHECKOUT.review(args)
        end
    output:
      next: result.next
      checkout_status: result.status
      checkout_view: result.checkout
      checkout_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties: {}
  run_checkout:
    description: Open the checkout REVIEW page for the standalone checkout flow so
      the user can read the order total, address and payment method. Never
      places an order.
    execute:
      kind: runtime
      implementation: lua
      # Its own module, so the cart's stays provably order-free: `check:flows` asserts the cart code
      # contains no checkout or order words, which only holds while the checkout lives elsewhere.
      modules:
        [
          "_common.61_rpc_storefront",
          "_common.62_rpc_sites",
          "_common.68_rpc_checkout"
        ]
      rpc:
        # No form submit and nothing that could place an order — the place-order button is READ, to report
        # whether it is there, and never clicked.
        allow: [ nav.navigate, dom.get_location_href, dom.exists, dom.get_text, dom.click ]
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CHECKOUT.review(args)
        end
    output:
      next: result.next
      checkout_status: result.status
      checkout_view: result.checkout
      checkout_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties: {}
  verify_request:
    description: Check that service_query, user_requirements, a five-digit zip_code,
      and all four contact fields are present before search. Pure check; no
      navigation or side effects.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function nz(v) if v == nil or v == "" then return nil end return v end
        local zip = nz(args.zip_code)
        if nz(args.service_query) and nz(args.user_requirements)
           and zip and string.match(zip, "^%d%d%d%d%d$")
           and nz(args.submit_first_name) and nz(args.submit_last_name)
           and nz(args.submit_email) and nz(args.submit_phone) then
          return { next = "ok" }
        end
        return { next = "collect" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        service_query: { type: [ string, "null" ] }
        user_requirements: { type: [ string, "null" ] }
        zip_code: { type: [ string, "null" ] }
        submit_first_name: { type: [ string, "null" ] }
        submit_last_name: { type: [ string, "null" ] }
        submit_email: { type: [ string, "null" ] }
        submit_phone: { type: [ string, "null" ] }

  resolve_zip:
    description: Resolve a US ZIP code from an address string.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.71_rpc_zip" ]
      # The host allow-list is the grant. `rpc.allow` is for OPS and does not reach `net` — declaring
      # `net.fetch` there granted nothing, which is why our first probe concluded the capability was
      # absent. Both hosts the ladder uses are named: Photon for the point, the Census ZCTA reverse for the
      # ZIP that point falls in.
      net:
        allow: [ photon.komoot.io, geocoding.geo.census.gov ]
        maxCalls: 2
        timeoutMs: 8000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_ZIP.resolve(args)
        end
    output:
      next: collect
      zip_code: result.zip_code
      zip_source: result.source
      # `observed` is what the geocoder's response actually looked like. A parse that finds nothing is
      # indistinguishable from a place that does not exist, and guessing between them costs a live run.
      # On success this read `result.status`, which `Z.resolve` has never returned, so the state key the
      # retry node declares and requires was null exactly when the ZIP resolved. A literal is the honest
      # value: the only fact the success limb has to report is that it resolved.
      zip_status:
        {
          if: [ { var: result.zip_code }, "resolved", { var: result.observed } ]
        }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [ address ]
      properties:
        address: { type: string }

  search_service:
    description: Search Thumbtack for local pros matching the service query in the
      resolved ZIP.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.64_rpc_thumbtack" ]
      rpc:
        # Read-only: the shortlist is built from what the results page already shows.
        allow: [ nav.navigate, dom.get_location_href, dom.exists, dom.query_all ]
        opTimeoutMs: 2000
        deadlineMs: 90000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_THUMBTACK.search_service(args)
        end
    output:
      # The script picks its own branch. Deriving one from `result.status` here overrode it and sent a
      # finished search back into the node that had just run it.
      next: result.next
      query: result.query
      # `T.search_service` never returns a `status`, so this read `null` on success AND on failure while
      # the quote flow declared the key. Derived from the error the way `shopping_search_product` does.
      search_status:
        if: [ { var: result.error }, { var: result.error }, "ok" ]
      # A rejected ZIP is removed before collection resumes; otherwise the finish gate immediately
      # searches the same value again. On every other branch the script returns the current ZIP.
      zip_code: result.zip_code
      zip_status: result.zip_status
      candidates: result.candidates
      total_count: result.total_count
      # `service_options` was mapped from a key the script never returns and named by no prompt or
      # selector. Deleted rather than invented: the candidate list IS the options.
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [ service_query, zip_code ]
      properties:
        service_query: { type: string }
        zip_code: { type: string }

  prepare_service_results_table:
    description: Convert searched Thumbtack candidates into deterministic built-in
      table-widget data.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local candidates = args.candidates or {}
        local rows = {}
        local MAX_ROWS = 10
        local function cell(value)
          if value == nil or value == "" then return "-" end
          return value
        end
        local limit = #candidates
        if limit > MAX_ROWS then limit = MAX_ROWS end
        for i = 1, limit do
          local candidate = candidates[i] or {}
          local name = tostring(cell(candidate.name))
          local pro = name
          local url = candidate.url
          if type(url) == "string" and string.match(url, "^https?://") then
            pro = {
              text = name,
              action = { type = "link", url = url, target = "_blank" },
            }
          end
          rows[#rows + 1] = {
            pro = pro,
            rating = cell(candidate.rating),
            reviews = cell(candidate.review_count),
            price = cell(candidate.price_text),
            response = cell(candidate.response_time),
            hires = cell(candidate.hire_count),
          }
        end
        if #rows == 0 then return { next = "error" } end
        local count = math.floor(tonumber(args.total_count) or #rows)
        local service = tostring(cell(args.service_query))
        return {
          next = "render",
          service_results_table = {
            caption = "Thumbtack results for " .. service .. " (" .. tostring(count) .. ")",
            columns = {
              { key = "pro", label = "Professional" },
              { key = "rating", label = "Rating", align = "center" },
              { key = "reviews", label = "Reviews", align = "end" },
              { key = "price", label = "Price", align = "end" },
              { key = "response", label = "Response" },
              { key = "hires", label = "Hires", align = "end" },
            },
            rows = rows,
          },
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        service_query: { type: [ string, "null" ] }
        candidates: { type: [ array, "null" ] }
        total_count: { type: [ integer, number, "null" ] }

  render_service_results:
    description: Render the prepared service-results data with the built-in table widget.
    execute:
      kind: runtime
      implementation: lua
      # No round trip: the envelope is built from a table our own Lua already produced. The consumer
      # re-validates it (`parseWidgetEnvelope` runs the template's zod schema and re-applies its defaults),
      # so rendering here cannot weaken the shape — what it needs is correct escaping, which is why this
      # uses the runtime's `json.encode` instead of building JSON by hand.
      modules: [ "_common.69_rpc_widget" ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_WIDGET.render({ template_id = "table", data = (args or {}).service_results_table })
        end
    output:
      next: result.next
      service_results_widget: result.value
      error: result.error
    parameters:
      type: object
      additionalProperties: true
      required: [ service_results_table ]
      properties:
        service_results_table: { type: object, additionalProperties: true }
  present_service_results:
    description: Present the rendered results widget and ask once for the user's
      refinement criterion.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        if args.question ~= nil and args.question ~= "" then
          return { next = "refine" }
        end
        local widget = args.service_results_widget
        if type(widget) ~= "string" or string.sub(widget, 1, 12) ~= "```ax-widget" then
          return { next = "error" }
        end
        local text = tostring(args.requestText or "")
        local korean = false
        for i = 1, #text do
          local byte = string.byte(text, i)
          if byte >= 234 and byte <= 237 then korean = true break end
        end
        local prompt
        if korean then
          prompt = "검색 결과를 표로 정리했습니다. 평점 높은 순, 리뷰 많은 순, 저렴한 순, 빠른 응답 또는 이름/설명 키워드 중 어떤 기준으로 전문가를 골라볼까요?"
        else
          prompt = "The search results are shown in the table. Which criterion should I use to choose professionals: highest rating, most reviews, lowest price, fastest response, or a name/description keyword?"
        end
        return {
          next = "ask",
          question = widget .. "\n\n" .. prompt,
          refine_stage = "criteria",
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        requestText: { type: [ string, "null" ] }
        question: { type: [ string, "null" ] }
        service_results_widget: { type: [ string, "null" ] }

  prepare_refined_results_table:
    description: Convert the refined Thumbtack shortlist into deterministic built-in
      table-widget data.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local selected = args.refine_selected or {}
        local rows = {}
        local MAX_ROWS = 10
        local function cell(value)
          if value == nil or value == "" then return "-" end
          return value
        end
        local limit = #selected
        if limit > MAX_ROWS then limit = MAX_ROWS end
        for i = 1, limit do
          local candidate = selected[i] or {}
          local name = tostring(cell(candidate.name))
          local pro = name
          local url = candidate.url
          if type(url) == "string" and string.match(url, "^https?://") then

            pro = {
              text = name,
              action = { type = "link", url = url, target = "_blank" },
            }
          end
          rows[#rows + 1] = {
            pro = pro,
            rating = cell(candidate.rating),
            price = cell(candidate.price_text),
            why = cell(candidate.why),
          }
        end
        if #rows == 0 then return { next = "error" } end
        return {
          next = "render",
          refined_results_table = {
            caption = "Selected Thumbtack professionals (" .. tostring(#rows) .. ")",
            columns = {
              { key = "pro", label = "Professional" },
              { key = "rating", label = "Rating", align = "center" },
              { key = "price", label = "Price", align = "end" },
              { key = "why", label = "Why selected" },
            },
            rows = rows,
          },
        }
    parameters:
      type: object
      additionalProperties: false
      required: [ refine_selected ]
      properties:
        refine_selected:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

  render_refined_results:
    description: Render the refined shortlist with the built-in table widget.
    execute:
      kind: runtime
      implementation: lua
      # No round trip: the envelope is built from a table our own Lua already produced. The consumer
      # re-validates it (`parseWidgetEnvelope` runs the template's zod schema and re-applies its defaults),
      # so rendering here cannot weaken the shape — what it needs is correct escaping, which is why this
      # uses the runtime's `json.encode` instead of building JSON by hand.
      modules: [ "_common.69_rpc_widget" ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_WIDGET.render({ template_id = "table", data = (args or {}).refined_results_table })
        end
    output:
      next: result.next
      refined_results_widget: result.value
      error: result.error
    parameters:
      type: object
      additionalProperties: true
      required: [ refined_results_table ]
      properties:
        refined_results_table: { type: object, additionalProperties: true }
  present_refined_results:
    description: Present the rendered refined-shortlist widget and ask once for
      explicit quote approval.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        if args.quote_confirm_stage == "asked" then
          return { next = "confirm" }
        end
        local widget = args.refined_results_widget
        if type(widget) ~= "string" or string.sub(widget, 1, 12) ~= "```ax-widget" then
          return { next = "error" }
        end
        local text = tostring(args.requestText or "")
        local korean = false
        for i = 1, #text do
          local byte = string.byte(text, i)
          if byte >= 234 and byte <= 237 then korean = true break end
        end
        local prompt
        if korean then
          prompt = "선택된 전문가를 표로 정리했습니다. 이 전문가(들)에게 견적을 요청할까요? 진행하려면 '예', 다시 고르려면 알려주세요."
        else
          prompt = "The selected professionals are shown in the table. Should I request quotes from them? Reply yes to proceed, or tell me how you want to choose again."
        end
        return {
          next = "ask",
          question = widget .. "\n\n" .. prompt,
          quote_confirm_stage = "asked",
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        requestText: { type: [ string, "null" ] }
        refined_results_widget: { type: [ string, "null" ] }
        quote_confirm_stage: { type: [ string, "null" ] }

  pick_quote:
    description: Deterministically pick the next candidate pro to open and advance
      quote_index. No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        -- Projected from flow state (action_contract): candidate list, loop index, and the
        -- per-pro signals open_quote/answer_quote wrote for the pro we just finished.
        local cands = args.candidates or {}
        local idx = args.quote_index or 0    -- count of pros already opened (0-based)
        local MAX_OPEN = 6                    -- attempted = min(#candidates, MAX_OPEN). The whole quote form is now one runtime call, so each pro costs ~3 global flow steps (pick+open+submit); 6 pros fit maxSteps=64 with margin.
        -- quote_results is a newline-joined summary STRING (one line per pro). A string avoids
        -- the array/object serialization ambiguity an empty Lua table would hit at the schema.
        local results = args.quote_results or ""

        -- Record the pro we just finished (cands[idx], 1-based) before picking the next one.
        if idx > 0 then
          local prev = cands[idx] or {}
          local function nz(v) if v == nil or v == "" then return nil end return v end
          local open_err = nz(args.quote_error)
          local submit_status = nz(args.quote_submit_status)
          local submit_msg = nz(args.quote_submit_message)
          local submit_err = nz(args.quote_submit_error)
          local outcome
          local open_msg = nz(args.quote_message)
          if open_err == "pro_unavailable" then
            -- Thumbtack renders no quote CTA when the pro cannot take the job, and it says why. Printing
            -- our error code instead read as our failure and invited a retry that could never work.
            outcome = "Thumbtack: \"" .. tostring(open_msg or "this pro cannot do the job") .. "\""
          elseif open_err then
            -- Where the WIZARD was, not just where the browser ended up. Two live failures reported the
            -- pro's profile text and nothing about the form, so the run had to be repeated to learn
            -- anything. The last question and the answers given are what make the next question askable.
            local where = nz(args.quote_last_step)
            local said = nz(args.quote_answered)
            outcome = "FAILED to open/answer (" .. tostring(open_err)
              .. (open_msg and (": " .. tostring(open_msg)) or "") .. ")"
              .. (where and (" last question: \"" .. tostring(where) .. "\"") or "")
              .. (said and (" answered: " .. tostring(said)) or "")
          elseif submit_msg then
            outcome = "Submitted -> Thumbtack error popover: \"" .. tostring(submit_msg) .. "\""
          elseif submit_status == "submitted" then
            outcome = "Submitted -> no error returned"
          elseif submit_status then
            outcome = "Submit attempted -> " .. tostring(submit_status) .. (submit_err and (" (" .. tostring(submit_err) .. ")") or "")
          elseif args.quote_reached_submit == true then
            outcome = "Reached final submit step (submit not attempted)"
          else
            outcome = "Stopped before submit (" .. tostring(args.quote_advance_reason or "no further auto-answer") .. ")"
          end
          local line = tostring(prev.name or "?") .. " [service_id " .. tostring(prev.service_id or "?") .. "]: " .. outcome
          results = (results ~= "" and (results .. "\n") or "") .. line
        end

        local limit = #cands
        if limit > MAX_OPEN then limit = MAX_OPEN end
        if idx < limit then
          local c = cands[idx + 1] or {}     -- Lua is 1-based; cands[idx+1] is the next unopened pro
          return {
            next = "open",
            quote_url = c.url,
            quote_target_service_id = c.service_id,
            quote_index = idx + 1,
            quote_results = results,
            -- clear per-pro signals so an open failure on the next pro can't inherit this result
            quote_error = "",
            quote_message = "",
            quote_reached_submit = false,
            quote_answer_status = "",
            quote_status = "",
            quote_submit_status = "",
            quote_submit_message = "",
            quote_submit_error = "",
          }
        end
        return { next = "done", quote_index = idx, quote_results = results, quote_count = idx }
    parameters:
      type: object
      additionalProperties: true
      properties:
        candidates: { type: array }
        quote_index: { type: [ integer, "null" ] }
        quote_results: { type: [ string, "null" ] }
        quote_error: { type: [ string, "null" ] }
        quote_reached_submit: { type: [ boolean, "null" ] }
        quote_answer_status: { type: [ string, "null" ] }
        quote_status: { type: [ string, "null" ] }
        quote_advance_reason: { type: [ string, "null" ] }
        quote_message: { type: [ string, "null" ] }
        quote_last_step: { type: [ string, "null" ] }
        quote_answered: { type: [ string, "null" ] }
        quote_submit_status: { type: [ string, "null" ] }
        quote_submit_message: { type: [ string, "null" ] }
        quote_submit_error: { type: [ string, "null" ] }

  cancel_quote_request:
    description: Record that the user declined or cancelled the quote request.
      Nothing is searched, opened, or sent.
    execute: { kind: runtime, implementation: passthrough }
    output:
      next: cancel
    parameters:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [ string, "null" ] }

  checkout_entry:
    description: Route a fresh checkout entry into the site handoff without a remote
      round trip.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute: { kind: runtime, implementation: lua, lua: 'return { next = "open" }' }
    parameters: { type: object, additionalProperties: true, properties: {} }

  site_entry:
    description: Route a fresh site-assistant entry into the site handoff without a
      remote round trip.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute: { kind: runtime, implementation: lua, lua: 'return { next = "open" }' }
    parameters: { type: object, additionalProperties: true, properties: {} }

  detect_cancellation:
    description: Decide whether the latest message is a standalone refusal rather
      than a request.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute:
      kind: runtime
      implementation: lua
      lua: |-
        local text = type(args.requestText) == "string" and args.requestText or ""
        text = text:gsub("^%s+", ""):gsub("%s+$", "")
        if text == "" then return { next = "continue" } end
        local lowered = text:lower()
        local refusals = {
          "취소", "그만", "됐어", "됐습니다", "안 할래", "안할래", "관두",
          "cancel", "never mind", "nevermind", "no thanks", "stop"
        }
        local requests = {
          "찾아", "알아봐", "해줘", "요청해", "받아", "보여", "검색", "물어", "문의", "가능한", "업체",
          "정책", "find", "search", "show", "book", "policy"
        }
        local refusing = false
        for index = 1, #refusals do
          if lowered:find(refusals[index], 1, true) then refusing = true break end
        end
        if not refusing then return { next = "continue" } end
        -- A message that still ASKS for something is a request mentioning cancellation, not a refusal.
        for index = 1, #requests do
          if lowered:find(requests[index], 1, true) then return { next = "continue" } end
        end
        return { next = "cancel", cancelled_text = text }
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [ string, "null" ] }

  browse_service_candidates:
    description: Rank, filter, window, and select searched Thumbtack pros
      deterministically from the site data.
    execute:
      kind: runtime
      implementation: lua
      # No rpc block: this command never touches the browser, so it is granted no ops.
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.53_verify",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.56_store_io",
          "_common.63_pure_entries"
        ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_PURE.run("AX_browse_service_candidates", args)
        end
    output:
      next: result.next
      shortlist: result.shortlist
      question: result.question
      shortlist_text: result.shortlist_text
      refine_selected: result.refine_selected
      refine_error: result.refine_error
      view_page: result.view_page
      view_pages: result.view_pages
      view_total: result.view_total
      refine_stage: criteria
      page_command: null
      page_number: null
      choice_numbers: null
      # The active criterion must survive the turn: clearing it made the next selection resolve against
      # the default ranking, so numbers from a sorted window picked different pros.
      refine_request: result.refine_request
    parameters:
      type: object
      additionalProperties: false
      required: [ candidates ]
      properties:
        requestText: { type: [ string, "null" ] }
        userMessages: { type: [ array, "null" ], items: { type: string } }
        candidates:
          {
            type: [ array, "null" ],
            items: { type: object, additionalProperties: true }
          }
        refine_request: { type: [ string, "null" ] }
        page_command: { type: [ string, "null" ], enum: [ next, prev, first, last, null ] }
        page_number: { type: [ integer, number, "null" ] }
        choice_numbers: { type: [ string, "null" ] }
        view_page: { type: [ integer, number, "null" ] }

  select_pros:
    description: Replace the candidate list with the user-approved shortlist
      (refine_selected) and reset the quote loop index. No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local sel = args.refine_selected or {}
        local list = {}
        for i = 1, #sel do
          local c = sel[i] or {}
          local url = c.url
          local sid = c.service_id
          if (url and url ~= "") or (sid and sid ~= "") then
            list[#list + 1] = { name = c.name, service_id = sid, url = url }
          end
        end
        if #list == 0 then
          return { next = "done" }
        end
        return { next = "pick", candidates = list, quote_index = 0, quote_results = "" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        refine_selected: { type: [ array, "null" ] }

  open_quote:
    description: Open the picked pro's quote request and answer every step it can
      answer, stopping at the final Submit. Never submits or sends.
    execute:
      kind: runtime
      implementation: lua
      # The wizard's decisions are the shared, DOM-free core; only the selectors are Thumbtack's.
      modules: [ "_common.00_base", "_common.10_form_wizard", "_common.65_rpc_quote" ]
      rpc:
        # `click_text` picks by visible label, the one thing CSS cannot express — the quote CTA carries no
        # id, aria-label or data-test and only build hashes. `read_many` batches a step's reads into one
        # round trip. Both are OPTIONAL: the script falls back when the client has not implemented them.
        # `submit_form` calls requestSubmit(), which advances a step whose synthetic button click the SPA
        # ignored. `page.eval` is gone — the client refuses it (`op_not_permitted`) and `click_text` is the
        # sanctioned replacement.
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.get_text,
            dom.query_all,
            dom.click,
            dom.click_text,
            dom.read_many,
            dom.set_value
          ]
        opTimeoutMs: 2000
        # A step costs ~15 round trips at roughly a second each — measured, and the platform says the second
        # is the CLIENT noticing the frame, not transport. 120000 is the platform's ceiling (it refuses the
        # document above it), so a longer form is bounded by the stall guard, not by more time.
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_QUOTE.request_quote(args)
        end
    output:
      # The script walks the whole form, so it is the only thing that knows whether the form ended at the
      # Submit, stalled, or was rejected. Deriving a branch here would overrule the pass that ran it.
      next: result.next
      quote_status: result.quote_status
      quote_error: result.quote_error
      quote_message: result.quote_message
      quote_last_step: result.quote_last_step
      quote_absence_waits: result.quote_absence_waits
      quote_clock: result.quote_clock
      quote_answered: result.quote_answered
      quote_advance_reason: result.quote_advance_reason
      # How many steps the single call drove. Without it a refusal cannot say whether the form was walked
      # or never started, which is the first thing anyone asks of one.
      quote_steps: result.quote_steps
      quote_reached_submit: result.quote_reached_submit
      quote_answer_status: result.quote_status
    parameters:
      type: object
      additionalProperties: true
      properties:
        quote_url: { type: string }
        quote_target_service_id: { type: [ string, "null" ] }
        user_requirements: { type: [ string, "null" ] }
        submit_email: { type: [ string, "null" ] }
        submit_first_name: { type: [ string, "null" ] }
        submit_last_name: { type: [ string, "null" ] }
        submit_phone: { type: [ string, "null" ] }
        zip_code: { type: [ string, "null" ] }
