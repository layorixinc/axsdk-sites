      quantity: tool.args.quantity
    output:
      next: result.next
      selection_error: result.error
      selected_offer: result.selected_offer
      selected_rank: result.selected_rank
      site: result.site
      product_id: result.product_id
      product_name: result.product_name
      quantity: result.quantity
      expected_unit_price: result.expected_unit_price
      expected_currency: result.expected_currency
      expected_identity_model: result.expected_identity_model
      approved_total_base: result.approved_total_base
      identity_id: result.identity_id
      comparison_id: result.comparison_id
      identity_approval: result.identity_approval
      comparison_approval: result.comparison_approval
      cart_approval: result.cart_approval
    parameters:
      type: object
      additionalProperties: false
      required: [offers, choice_index, choice_comparison_id, comparison_id, identity_id, choice_stage]
      properties:
        offers: { type: array, items: { type: object, additionalProperties: true } }
        choice_index: { type: [integer, number] }
        choice_comparison_id: { type: [string, "null"] }
        comparison_id: { type: string, minLength: 1 }
        identity_id: { type: string, minLength: 1 }
        choice_stage: { type: string, enum: [asked] }
        quantity: { type: [integer, number] }

  shopping_open_selected_store:
    description: Re-entrantly open the deterministically selected store before the guarded cart adapter.
    execute: { kind: remote, tool: AX_open_site, timeoutMs: 30000 }
    input:
      site: tool.args.site
    output:
      next: { if: [{ var: result.error }, "error", "add"] }
      cart_error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [site]
      properties:
        site: { type: string, enum: [amazon, walmart, ebay, aliexpress, etsy, coupang, naver-shopping, gmarket, 11st, ssg] }

  shopping_add_selected_store_offer:
    description: Revalidate product identity and price, then add only the explicitly selected current offer. Never checks out or orders.
    execute: { kind: remote, tool: AX_add_store_product_to_cart, timeoutMs: 120000 }
    input:
      site: tool.args.site
      product_id: tool.args.product_id
      quantity: tool.args.quantity
      expected_unit_price: tool.args.expected_unit_price
      expected_currency: tool.args.expected_currency
      expected_identity_model: tool.args.expected_identity_model
      identity_id: tool.args.identity_id
      comparison_id: tool.args.comparison_id
      identity_approval: tool.args.identity_approval
      comparison_approval: tool.args.comparison_approval
      cart_approval: tool.args.cart_approval
    output:
      next: { if: [{ var: result.pending }, "navigating", { if: [{ var: result.added }, "done", "error"] }] }
      cart_status: { if: [{ var: result.pending }, "navigating", { if: [{ var: result.added }, "added", "failed"] }] }
      cart_error: { if: [{ var: result.pending }, "navigation_pending", { if: [{ var: result.login_required }, "login_required", { var: result.error }] }] }
      cart_confirmation: result.confirmation
      cart_url: result.cart_url
    effect: mutation
    consent: required
    idempotent: true
    require:
      cart_approval: user_selected_compared_offer
      identity_approval: locked_product_identity
      comparison_approval: current_comparison
    parameters:
      type: object
      additionalProperties: false
      required: [site, product_id, identity_id, comparison_id, identity_approval, comparison_approval, cart_approval]
      properties:
        site: { type: string, enum: [amazon, walmart, ebay, aliexpress, etsy, coupang, naver-shopping, gmarket, 11st, ssg] }
        product_id: { type: string, minLength: 1 }
        quantity: { type: [integer, number] }
        expected_unit_price: { type: [number, "null"] }
        expected_currency: { type: [string, "null"] }
        expected_identity_model: { type: [string, "null"] }
        identity_id: { type: string, minLength: 1 }
        comparison_id: { type: string, minLength: 1 }
        identity_approval: { type: string, enum: [locked_product_identity] }
        comparison_approval: { type: string, enum: [current_comparison] }
        cart_approval: { type: string, enum: [user_selected_compared_offer] }
  decide:
    description: Select configured intent flows and initial runtime state for the config-runtime planner.
    parameters:
      type: object
      additionalProperties: false
      required: [action, intents]
      properties:
        set: { type: boolean }
        action: { type: string, enum: [continue_current, replace_current, clarify, out_of_scope] }
        intents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [intent, segments, state]
            properties:
              intent: { type: string, enum: [request_service_quote, shopping_single_site, shopping_multi_store_total_cost, bluemoonsoft, end_conversation, checkout, memory] }
              segments:
                type: array
                minItems: 1
                items: { type: string }
              state:
                type: object
                additionalProperties: false
                required: [requestText]
                properties:
                  requestText: { type: string, minLength: 1 }
                  followup:
                    type: object
                    additionalProperties: true
                    required: [type, question]
                    properties:
                      type: { type: string, enum: [info_question] }
                      question: { type: string, minLength: 1 }
                      topic: { type: string, minLength: 1 }
                      scope: { type: string, enum: [active_state] }
        question: { type: string }
        conversationSummary: { type: string }
        latestMessageInterpretation: { type: string }
        reason: { type: string }

  plan_memory:
    description: Plan one explicit memory operation and project its exact arguments into flow state.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: false
      required: [next, operation]
      properties:
        next: { type: string, enum: [list, get, search, find_delete, delete, set, error] }
        operation: { type: string, enum: [list, get, search, delete, set, delete_candidates] }
        key: { type: string, minLength: 1 }
        regex: { type: string, minLength: 1, maxLength: 200 }
        delete_keys:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        confirmed: { type: boolean }
        memory_entries:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: { type: string, minLength: 1 }
              value: { type: string }

  prepare_memory:
    description: Convert validated key/value entries into one bulk memory map.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local entries = args.memory_entries or {}
        local memory = {}
        local count = 0
        for i = 1, #entries do
          local entry = entries[i] or {}
          local key = entry.key
          local value = entry.value
          if type(key) ~= "string" or key == "" or type(value) ~= "string" then
            return { next = "error", error = "invalid memory entry" }
          end
          memory[key] = value
          count = count + 1
        end
        if count == 0 then
          return { next = "error", error = "memory entries are empty" }
        end
        return { next = "set", memory = memory, confirmed = true }
    parameters:
      type: object
      additionalProperties: false
      required: [memory_entries]
      properties:
        memory_entries:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: { type: string, minLength: 1 }
              value: { type: string }

  list_memory:
    description: List all saved memory keys.
    execute: { kind: remote, tool: AX_get_memory }
    input: {}
    output:
      next: { if: [{ var: result.error }, "error", "report"] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: true

  get_memory:
    description: Read one exact saved memory key.
    execute: { kind: remote, tool: AX_get_memory }
    input:
      key: tool.args.key
    output:
      next: { if: [{ var: result.error }, "error", "report"] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1 }

  search_memory:
    description: Search saved memory with one case-insensitive regex and return bounded Markdown.
    execute: { kind: remote, tool: AX_search_memory }
    input:
      regex: tool.args.regex
    output:
      next: { if: [{ var: result.ok }, "report", "error"] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: false
      required: [regex]
      properties:
        regex: { type: string, minLength: 1, maxLength: 200 }

  find_delete_candidates:
    description: Find exact memory key candidates for an explicit category deletion request.
    execute: { kind: remote, tool: AX_search_memory }
    input:
      regex: tool.args.regex
    output:
      next:
        if:
          - { var: result.ok }
          - { if: [{ var: result.keys.0 }, "choose", "not_found"] }
          - "error"
      memory_result: result
    parameters:
      type: object
      additionalProperties: false
      required: [regex]
      properties:
        regex: { type: string, minLength: 1, maxLength: 200 }

  choose_delete_keys:
    description: Ask for or resolve one or more exact memory keys to delete.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: false
      required: [next, question, delete_keys, confirmed]
      properties:
        next: { type: string, enum: [ask, delete, cancelled, error] }
        question: { type: [string, "null"] }
        delete_keys:
          type: array
          items: { type: string }
        confirmed: { type: boolean }

  delete_memory:
    description: Delete one or more exact GLOBAL memory keys selected by the user.
    execute: { kind: remote, tool: AX_delete_memory }
    input:
      keys: tool.args.delete_keys
    output:
      next: { if: [{ var: result.ok }, "report", "error"] }
      memory_result: result
    effect: mutation
    consent: required
    idempotent: true
    require: { confirmed: true }
    parameters:
      type: object
      additionalProperties: false
      required: [delete_keys, confirmed]
      properties:
        delete_keys:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        confirmed: { type: boolean }

  set_memory:
    description: Set final memory values in one call. Non-empty Markdown saves; an empty string deletes.
    execute: { kind: remote, tool: AX_set_memory_bulk }
    input:
      memory: tool.args.memory
    output:
      next: { if: [{ var: result.ok }, "report", "error"] }
      memory_result: result
    effect: mutation
    consent: required
    idempotent: true
    require: { confirmed: true }
    parameters:
      type: object
      additionalProperties: false
      required: [memory, confirmed]
      properties:
        confirmed: { type: boolean }
        memory:
          type: object
          minProperties: 1
          description: Memory key to complete Markdown. A non-empty value saves; an empty value deletes.
          additionalProperties: { type: string }

  collect_quote_service:
    description: Scan the complete latest user message for a named service and any work scope or timing before asking. For example, "핸디맨으로 작은 집 청소, 48시간 내 일회성" is a complete handyman service stage.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local service = clean(args.service_query)
        local requirements = clean(args.user_requirements)
        local out = {
          next = "collect",
          service_query = service,
          user_requirements = requirements,
        }
        if not service or not requirements then out.question = clean(args.question) end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [question, service_query, user_requirements]
      properties:
        question: { type: [string, "null"] }
        service_query: { type: [string, "null"], minLength: 1 }
        user_requirements: { type: [string, "null"], minLength: 1 }

  collect_quote_location:
    description: Copy an explicit five-digit token from the complete latest user message as the ZIP; otherwise translate its US city/address to English. "샌프란시스코에서" must produce address "San Francisco, CA", not a question.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local address = clean(args.address)
        local zip = clean(args.zip_code)
        local out = { next = "collect", address = address, zip_code = zip }
        if not address and not zip then out.question = clean(args.question) end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [question, address, zip_code]
      properties:
        question: { type: [string, "null"] }
        address: { type: [string, "null"], minLength: 1 }
        zip_code: { type: [string, "null"], pattern: "^[0-9]{5}$" }

  collect_quote_location_retry:
    description: Ask for and collect a replacement location after ZIP resolution fails.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end

          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local address = clean(args.address)
        local zip = clean(args.zip_code)
        local status = clean(args.zip_status)
        local out = { next = "collect", address = address, zip_code = zip }
        if zip or (address and not status) then
          out.zip_status = nil
        else
          out.zip_status = status or "resolve_failed"
          out.question = clean(args.question)
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [question, address, zip_code, zip_status]
      properties:
        question: { type: [string, "null"] }
        address: { type: [string, "null"], minLength: 1 }
        zip_code: { type: [string, "null"], pattern: "^[0-9]{5}$" }
        zip_status: { type: [string, "null"] }

  collect_quote_contact:
    description: Extract every supplied first name, last name, email, and phone from the complete latest user message, then ask for all still-missing contacts in the user's language. For Korean input ask in Korean, for example "이름, 성, 이메일, 전화번호를 알려주세요."
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function clean(v)
          if v == nil then return nil end
          local lower = string.lower(tostring(v))
          if lower == "null" or lower == "none" or lower == "unknown" or lower == "n/a" then return nil end
          return v
        end
        local phone = clean(args.submit_phone)
        local email = clean(args.submit_email)
        local first_name = clean(args.submit_first_name)
        local last_name = clean(args.submit_last_name)
        local out = {
          next = "collect",
          submit_phone = phone,
          submit_email = email,
          submit_first_name = first_name,
          submit_last_name = last_name,
        }
        if not phone or not email or not first_name or not last_name then
          out.question = clean(args.question)
        end
        return out
    parameters:
      type: object
      additionalProperties: false
      required: [question, submit_phone, submit_email, submit_first_name, submit_last_name]
      properties:
        question: { type: [string, "null"] }
        submit_phone: { type: [string, "null"], minLength: 1 }
        submit_email: { type: [string, "null"], minLength: 1 }
        submit_first_name: { type: [string, "null"], minLength: 1 }
        submit_last_name: { type: [string, "null"], minLength: 1 }

  finish_quote_request:
    description: Finish collection after every required quote-request field is present.
    execute: passthrough
    output:
      next: done
      question: null
    parameters:
      type: object
      additionalProperties: false
      properties: {}

  confirm_quote_decision:
    description: Record the user's approval decision before any quote is requested — proceed, return to refine the selection, or keep asking.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [ask, proceed, refine, cancel] }
        question: { type: string }
        refine_stage: { type: [string, "null"] }
        quote_confirm_stage: { type: [string, "null"] }
        message: { type: string }

  followup_decision:
    description: After reporting quote outcomes, choose whether to request more quotes from the current results, start a new service request, or finish — carrying any state reset needed.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [ask, more, new, done] }
        question: { type: string }
        message: { type: string }
        refine_stage: { type: [string, "null"] }
        refine_selected: { type: [array, "null"] }
        service_query: { type: [string, "null"] }
        user_requirements: { type: [string, "null"] }
        quote_results: { type: [string, "null"] }
        followup_stage: { type: [string, "null"] }

  collect_shopping:
    description: Fill the shopping list (shop_plan — an array of { query, quantity }) and choose the next step (ask the user to clarify, or finish).
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [ask, done] }
        question: { type: string }
        shop_plan:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              query: { type: string }
              quantity: { type: [integer, number] }
        message: { type: string }

  assist_decide:
    description: On arrival at BlueMoonSoft, choose whether to navigate to a requested page or ask the user what they need.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [navigate, ask] }
        question: { type: string }
        message: { type: string }

  sitemap_search:
    description: Search the current site's sitemap for pages matching a case-insensitive regex; returns matching lines (each with a path).
    execute: { kind: remote, tool: AX_sitemap_search }
    input:
      regex: tool.args.regex
      limit: tool.args.limit
    output:
      next: { if: [{ var: result.error }, "error", "go"] }
      sitemap_hits: result.chunks
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [regex]
      properties:
        regex: { type: string }
        limit: { type: [integer, number] }

  navigate_page:
    description: Navigate the current page to a same-site path or URL (a BlueMoonSoft sitemap page).
    execute: { kind: remote, tool: AX_navigate, timeoutMs: 60000 }
    input:
      link: tool.args.link
    output:
      next: { if: [{ var: result.error }, "error", "go"] }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [link]
      properties:
        link: { type: string }

  next_product:
    description: Record the item just processed into shop_results and pick the next item from shop_plan (sets query/quantity, advances shop_index). No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local plan = args.shop_plan or {}
        local idx = args.shop_index or 0
        local results = args.shop_results or ""
        local function nz(v) if v == nil or v == "" then return nil end return v end
        if idx > 0 then
          local prev = plan[idx] or {}
          local q = tostring(prev.query or "?")
          local qty = prev.quantity or 1
          local outcome
          if args.add_status == "added" then
            outcome = "added (x" .. tostring(qty) .. ")" .. (nz(args.product_name) and (" - " .. tostring(args.product_name)) or "")
          elseif args.add_status == "pending" then
            outcome = "add pending (x" .. tostring(qty) .. ")"
          elseif nz(args.add_error) then
            outcome = "NOT added (" .. tostring(args.add_error) .. ")"
          elseif not nz(args.product_id) then
            outcome = "no product found"
          else
            outcome = "skipped"
          end
          results = (results ~= "" and (results .. "\n") or "") .. q .. ": " .. outcome
        end
        if idx < #plan then
          local item = plan[idx + 1] or {}
          return {
            next = "shop",
            query = item.query,
            quantity = item.quantity or 1,
            shop_index = idx + 1,
            shop_results = results,
            search_status = "",
            product_id = "",
            product_name = "",
            add_status = "",
            add_error = "",
            shop_refine_stage = "",
          }
        end
        return { next = "done", shop_index = idx, shop_results = results, shop_count = idx }
    parameters:
      type: object
      additionalProperties: true
      properties:
        shop_plan: { type: [array, "null"] }
        shop_index: { type: [integer, "null"] }
        shop_results: { type: [string, "null"] }
        product_id: { type: [string, "null"] }
        product_name: { type: [string, "null"] }
        add_status: { type: [string, "null"] }
        add_error: { type: [string, "null"] }


  shopping_search_product:
    description: Search the shopping site for the current item's query; returns candidate products.
    execute:
      kind: runtime
      implementation: lua
      modules: ["_common.61_rpc_storefront", "_common.62_rpc_sites"]
      rpc:
        allow: [nav.navigate, dom.get_location_href, dom.exists, dom.query_all, dom.get_text]
        opTimeoutMs: 2000
        deadlineMs: 90000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_STOREFRONT.run_open_site_search(args)
        end
    input:
      query: tool.args.query
    output:
      # The script already chose its branch; deriving one from `result.error` here overrode it and sent
      # an unported store to `next_product` instead of to the durable sibling.
      next: result.next
      candidates: result.candidates
      search_status: { if: [{ var: result.error }, { var: result.error }, "ok"] }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string }

  pick_product:
    description: Pick the first usable search candidate to add to the cart. No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local cands = args.candidates or {}
        for i = 1, #cands do
          local c = cands[i] or {}
          local id = c.id
          if id ~= nil and id ~= "" then
            return { next = "add", product_id = id, product_name = c.name or c.title }
          end
        end
        return { next = "skip", product_id = "", product_name = "" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        candidates: { type: [array, "null"] }

  shopping_add_to_cart:
    description: Add the picked product to the cart with the requested quantity. Navigates to the product page, clicks Add to Cart, declines optional warranty, reads the confirmation. Never places an order.
    execute: { kind: remote, tool: AX_add_to_cart, timeoutMs: 90000 }
    input:
      product_id: tool.args.product_id
      quantity: tool.args.quantity
    output:
      next: "done"
      add_status: { if: [{ var: result.added }, "added", { var: result.pending }, "pending", "failed"] }
      add_error: result.error
    effect: mutation
    consent: required
    idempotent: true
    require: { product_id: true }
    parameters:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id: { type: string }
        quantity: { type: [integer, number, string] }


  refine_products:
    description: Refine the searched products for the current item — ask the user which product / how to narrow, or (after they answer) record the chosen product to add, or skip. The LLM ranks/filters the candidates; this tool captures the decision.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [ask, pick, skip] }
        question: { type: string }
        shop_refine_stage: { type: [string, "null"] }
        product_id: { type: [string, "null"] }
        product_name: { type: [string, "null"] }
        message: { type: string }

  checkout_decision:
    description: Record the user's checkout approval decision after items are in the cart — proceed to the checkout page (no order placed), finish without checkout, or keep asking.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: true
      required: [next]
      properties:
        next: { type: string, enum: [ask, checkout, done] }
        question: { type: string }
        checkout_stage: { type: [string, "null"] }
        message: { type: string }

  checkout:
    description: Navigate to the Amazon cart and proceed to the checkout page for review. Never places an order.
    execute: { kind: remote, tool: AX_checkout, timeoutMs: 90000 }
    output:
      next: { if: [{ var: result.error }, "error", "done"] }
      checkout_status: result.status
      checkout_view: result.checkout
      checkout_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties: {}

  run_checkout:
    description: Navigate to the Amazon cart and proceed to the checkout page for review (standalone checkout flow). Never places an order.
    execute: { kind: remote, tool: AX_checkout, timeoutMs: 90000 }
    output:
      next: { if: [{ var: result.error }, "error", "done"] }
      checkout_status: result.status
      checkout_view: result.checkout
      checkout_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties: {}

  verify_request:
    description: Check that service_query, user_requirements, a five-digit zip_code, and all four contact fields are present before search. Pure check; no navigation or side effects.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local function nz(v) if v == nil or v == "" then return nil end return v end
        local zip = nz(args.zip_code)
        if nz(args.service_query) and nz(args.user_requirements)
           and zip and string.match(zip, "^%d%d%d%d%d$")
           and nz(args.submit_first_name) and nz(args.submit_last_name)
           and nz(args.submit_email) and nz(args.submit_phone) then
          return { next = "ok" }
        end
        return { next = "collect" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        service_query: { type: [string, "null"] }
        user_requirements: { type: [string, "null"] }
        zip_code: { type: [string, "null"] }
        submit_first_name: { type: [string, "null"] }
        submit_last_name: { type: [string, "null"] }
        submit_email: { type: [string, "null"] }
        submit_phone: { type: [string, "null"] }

  resolve_zip:
    description: Resolve a US ZIP code from an address string.
    execute: { kind: remote, tool: AX_resolve_zip }
    input:
      address: tool.args.address
    output:
      next: collect
      zip_code: result.zip_code
      zip_source: result.source
      zip_status: { if: [{ var: result.zip_code }, { var: result.status }, "resolve_failed"] }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string }

  open_site:
    description: Navigate to the target site's home page before searching. Site-keyed and idempotent — a no-op when already on the site; off-site it fires the navigation. A cross-domain navigation is terminal (no durable replay — the site script unloads on the domain change); the planner resumes the flow on the destination.
    execute: { kind: remote, tool: AX_open_site, timeoutMs: 60000 }
    input:
      site: tool.args.site
    output:
      next: { if: [{ var: result.error }, "error", "search"] }
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [site]
      properties:
        site: { type: string, enum: [thumbtack, amazon, bluemoonsoft] }

  search_service:
    description: Search Thumbtack for local pros matching the service query in the resolved ZIP.
    execute: { kind: remote, tool: AX_search_service, timeoutMs: 90000 }
    input:
      query: tool.args.service_query
      zip_code: tool.args.zip_code
    output:
      next: { if: [{ "==": [{ var: result.status }, "completed"] }, "done", { var: result.error }, "error", "read"] }
      query: result.query
      search_status: result.status
      candidates: result.candidates
      total_count: result.total_count
      service_options: result.service_options
      error: result.error
    parameters:
      type: object
      additionalProperties: false
      required: [service_query, zip_code]
      properties:
        service_query: { type: string }
        zip_code: { type: string }

  prepare_service_results_table:
    description: Convert searched Thumbtack candidates into deterministic built-in table-widget data.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local candidates = args.candidates or {}
        local rows = {}
        local MAX_ROWS = 10
        local function cell(value)
          if value == nil or value == "" then return "-" end
          return value
        end
        local limit = #candidates
        if limit > MAX_ROWS then limit = MAX_ROWS end
        for i = 1, limit do
          local candidate = candidates[i] or {}
          local name = tostring(cell(candidate.name))
          local pro = name
          local url = candidate.url
          if type(url) == "string" and string.match(url, "^https?://") then
            pro = {
              text = name,
              action = { type = "link", url = url, target = "_blank" },
            }
          end
          rows[#rows + 1] = {
            pro = pro,
            rating = cell(candidate.rating),
            reviews = cell(candidate.review_count),
            price = cell(candidate.price_text),
            response = cell(candidate.response_time),
            hires = cell(candidate.hire_count),
          }
        end
        if #rows == 0 then return { next = "error" } end
        local count = math.floor(tonumber(args.total_count) or #rows)
        local service = tostring(cell(args.service_query))
        return {
          next = "render",
          service_results_table = {
            caption = "Thumbtack results for " .. service .. " (" .. tostring(count) .. ")",
            columns = {
              { key = "pro", label = "Professional" },
              { key = "rating", label = "Rating", align = "center" },
              { key = "reviews", label = "Reviews", align = "end" },
              { key = "price", label = "Price", align = "end" },
              { key = "response", label = "Response" },
              { key = "hires", label = "Hires", align = "end" },
            },
            rows = rows,
          },
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        service_query: { type: [string, "null"] }
        candidates: { type: [array, "null"] }
        total_count: { type: [integer, number, "null"] }

  render_service_results:
    description: Render the prepared service-results data with the built-in table widget.
    execute: { kind: remote, tool: AX_render_widget }
    input:
      template_id: table
      data: tool.args.service_results_table
    output:
      next: present
      service_results_widget: result.value
    parameters:
      type: object
      additionalProperties: false
      required: [service_results_table]
      properties:
        service_results_table:
          type: object
          additionalProperties: false
          required: [caption, columns, rows]
          properties:
            caption: { type: string, minLength: 1 }
            columns:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [key, label]
                properties:
                  key: { type: string, minLength: 1 }
                  label: { type: string }
                  align: { type: string, enum: [start, center, end] }
            rows:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true

  present_service_results:
    description: Present the rendered results widget and ask once for the user's refinement criterion.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        if args.question ~= nil and args.question ~= "" then
          return { next = "refine" }
        end
        local widget = args.service_results_widget
        if type(widget) ~= "string" or string.sub(widget, 1, 12) ~= "```ax-widget" then
          return { next = "error" }
        end
        local text = tostring(args.requestText or "")
        local korean = false
        for i = 1, #text do
          local byte = string.byte(text, i)
          if byte >= 234 and byte <= 237 then korean = true break end
        end
        local prompt
        if korean then
          prompt = "검색 결과를 표로 정리했습니다. 평점 높은 순, 리뷰 많은 순, 저렴한 순, 빠른 응답 또는 이름/설명 키워드 중 어떤 기준으로 전문가를 골라볼까요?"
        else
          prompt = "The search results are shown in the table. Which criterion should I use to choose professionals: highest rating, most reviews, lowest price, fastest response, or a name/description keyword?"
        end
        return {
          next = "ask",
          question = widget .. "\n\n" .. prompt,
          refine_stage = "criteria",
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        requestText: { type: [string, "null"] }
        question: { type: [string, "null"] }
        service_results_widget: { type: [string, "null"] }

  prepare_refined_results_table:
    description: Convert the refined Thumbtack shortlist into deterministic built-in table-widget data.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local selected = args.refine_selected or {}
        local rows = {}
        local MAX_ROWS = 10
        local function cell(value)
          if value == nil or value == "" then return "-" end
          return value
        end
        local limit = #selected
        if limit > MAX_ROWS then limit = MAX_ROWS end
        for i = 1, limit do
          local candidate = selected[i] or {}
          local name = tostring(cell(candidate.name))
          local pro = name
          local url = candidate.url
          if type(url) == "string" and string.match(url, "^https?://") then

            pro = {
              text = name,
              action = { type = "link", url = url, target = "_blank" },
            }
          end
          rows[#rows + 1] = {
            pro = pro,
            rating = cell(candidate.rating),
            price = cell(candidate.price_text),
            why = cell(candidate.why),
          }
        end
        if #rows == 0 then return { next = "error" } end
        return {
          next = "render",
          refined_results_table = {
            caption = "Selected Thumbtack professionals (" .. tostring(#rows) .. ")",
