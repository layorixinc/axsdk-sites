  shopping_search_one_store:
    description: Search one mapped store with a runtime-side script that drives the
      page over RPC.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.61_rpc_storefront", "_common.62_rpc_sites" ]
      rpc:
        # Read-only. No write op is granted. The runtime refuses an omitted op immediately; the exact
        # static allow audit is currently limited to tools whose module call graph is unambiguous.
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.query_all,
            dom.get_text
          ]
        # A navigating script must keep this LOW. A document that accepts a poll and then unloads is
        # indistinguishable from a slow one, so the runtime waits out the whole op timeout: measured
        # 8000 → over 260s for one search, 2000 → 30s.
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_STOREFRONT.run_store_search(args)
        end
    output:
      # No `navigating`: the script keeps its own stack across the reload, so there is nothing to resume.
      next: result.next
      store_result: result.store_result
    parameters:
      type: object
      additionalProperties: false
      required: [ item, index, key, context ]
      properties:
        item:
          type: object
          additionalProperties: false
          required: [ site ]
          properties:
            site:
              {
                type: string,
                enum:
                  [
                    amazon,
                    walmart,
                    ebay,
                    aliexpress,
                    etsy,
                    coupang,
                    naver-shopping,
                    gmarket,
                    11st,
                    ssg
                  ]
              }
        index: { type: number }
        key: { type: string }
        context:
          type: object
          additionalProperties: true
          required: [ query ]
          properties:
            query: { type: string }
            quantity: { type: [ integer, number ] }
        page: { type: [ integer, number ] }
        # The wording to search. The collector answers the NEXT wording to try and the flow writes it
        # here; UNDECLARED, it was dropped at the boundary, so every retry re-asked the original question
        # until the subflow's node budget was gone. Nullable and not required: the first pass has none and
        # the script falls back to `context.query`.
        query: { type: [ string, "null" ] }

  shopping_collect_store_page:
    description: Merge one read result page into this store's accumulated candidates
      and decide whether another page is worth a navigation.
    execute:
      kind: runtime
      implementation: lua
      # No rpc block: these commands never touch the browser, so they are granted no ops at all.
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
