          "_common.56_store_io",
          "_common.63_pure_entries"
        ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_PURE.collect_store_page(args)
        end
    output:
      next: result.next
      page: result.page
      query: result.query
      tried_queries: result.tried_queries
      collected: result.collected
      # The entry already applies the rename (`page_stop_reason = result.stop_reason`), so reading
      # `result.stop_reason` here read a key the script does not answer and the state field was null on
      # every page. The value survived nested inside `store_result`, which is why nothing looked broken.
      page_stop_reason: result.page_stop_reason
      store_result: result.store_result
    parameters:
      type: object
      additionalProperties: false
      required: [ item, context, store_result, page ]
      properties:
        item:
          type: object
          additionalProperties: false
          required: [ site ]
          properties:
            site:
              {
                type: string,
                enum:
                  [
                    amazon,
                    walmart,
                    ebay,
                    aliexpress,
                    etsy,
                    coupang,
                    naver-shopping,
                    gmarket,
                    11st,
                    ssg
                  ]
              }
        context:
          type: object
          additionalProperties: true
          required: [ query ]
          properties:
            query: { type: string }
            quantity: { type: [ integer, number ] }
        store_result: { type: object, additionalProperties: true }
        collected:
          {
            type: [ array, "null" ],
            items: { type: object, additionalProperties: true }
          }
        page: { type: [ integer, number ] }
        # The retry loop's two scalars. UNDECLARED IS DROPPED: the runtime projects an action_contract's
        # arguments through this schema, so a field missing here never reaches the script no matter what
        # state holds. Traced live — `localState` showed both set while a probe inside the tool printed
        # nil, and discovery re-asked one store the same question until its node budget was gone.
        #
        # Nullable and NOT required, because the first pass carries null: `null` against `{type: string}`
        # is REJECTED, while `null` against a nullable type passes as nil and an absent key passes too.
        query: { type: [ string, "null" ] }
        tried_queries: { type: [ string, "null" ] }

  shopping_normalize_store_result:
    description: Apply common relevance, provenance, FX, and landed-cost
      normalization to one ready site adapter result.
    execute:
      kind: runtime
      implementation: lua
      # No rpc block: these commands never touch the browser, so they are granted no ops at all.
      # Network egress is SEPARATE from `rpc.allow`, and without this block the runtime has no `net` table
      # at all — the FX code took its own "no fetch available" path and every offer came back
      # `cost_error: fx_fetch_unavailable`, so a total-cost comparison never showed a total.
      net:
        allow: [ api.frankfurter.dev ]
        maxCalls: 2
        timeoutMs: 8000
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.53_verify",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.56_store_io",
          "_common.63_pure_entries"
        ]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_PURE.normalize_store_result(args)
        end
    output:
      next: done
      # `result` is the script's ENVELOPE — `{next, store_result}`. Publishing it put `site` and
      # `candidates` one level below where `resultFrom: store_result` looks, and every store failed the
      # fan-out schema with `site: expected string, received undefined`.
      store_result: result.store_result
    parameters:
      type: object
      additionalProperties: false
      required: [ item, context, store_result ]
      properties:
        item:
          type: object
          additionalProperties: false
          required: [ site ]
          properties:
            site:
              {
                type: string,
                enum:
                  [
                    amazon,
                    walmart,
                    ebay,
                    aliexpress,
                    etsy,
                    coupang,
                    naver-shopping,
                    gmarket,
                    11st,
                    ssg
                  ]
              }
        context:
          type: object
          additionalProperties: true
          required: [ query ]
          properties:
            query: { type: string }
            quantity: { type: [ integer, number ] }
        store_result: { type: object, additionalProperties: true }

