          },
        }
    parameters:
      type: object
      additionalProperties: false
      required: [refine_selected]
      properties:
        refine_selected:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

  render_refined_results:
    description: Render the prepared refined shortlist with the built-in table widget.
    execute: { kind: remote, tool: AX_render_widget }
    input:
      template_id: table
      data: tool.args.refined_results_table
    output:
      next: present
      refined_results_widget: result.value
    parameters:
      type: object
      additionalProperties: false
      required: [refined_results_table]
      properties:
        refined_results_table:
          type: object
          additionalProperties: false
          required: [caption, columns, rows]
          properties:
            caption: { type: string, minLength: 1 }
            columns:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [key, label]
                properties:
                  key: { type: string, minLength: 1 }
                  label: { type: string }
                  align: { type: string, enum: [start, center, end] }
            rows:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true

  present_refined_results:
    description: Present the rendered refined-shortlist widget and ask once for explicit quote approval.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        if args.quote_confirm_stage == "asked" then
          return { next = "confirm" }
        end
        local widget = args.refined_results_widget
        if type(widget) ~= "string" or string.sub(widget, 1, 12) ~= "```ax-widget" then
          return { next = "error" }
        end
        local text = tostring(args.requestText or "")
        local korean = false
        for i = 1, #text do
          local byte = string.byte(text, i)
          if byte >= 234 and byte <= 237 then korean = true break end
        end
        local prompt
        if korean then
          prompt = "선택된 전문가를 표로 정리했습니다. 이 전문가(들)에게 견적을 요청할까요? 진행하려면 '예', 다시 고르려면 알려주세요."
        else
          prompt = "The selected professionals are shown in the table. Should I request quotes from them? Reply yes to proceed, or tell me how you want to choose again."
        end
        return {
          next = "ask",
          question = widget .. "\n\n" .. prompt,
          quote_confirm_stage = "asked",
        }
    parameters:
      type: object
      additionalProperties: true
      properties:
        requestText: { type: [string, "null"] }
        refined_results_widget: { type: [string, "null"] }
        quote_confirm_stage: { type: [string, "null"] }

  pick_quote:
    description: Deterministically pick the next candidate pro to open and advance quote_index. No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        -- Projected from flow state (action_contract): candidate list, loop index, and the
        -- per-pro signals open_quote/answer_quote wrote for the pro we just finished.
        local cands = args.candidates or {}
        local idx = args.quote_index or 0    -- count of pros already opened (0-based)
        local MAX_OPEN = 6                    -- attempted = min(#candidates, MAX_OPEN). answer_quote's form self-loop is budgeted per-node via maxSelfSteps (exempt from global maxSteps), so each pro costs ~4 global flow steps (pick+open+answer-entry+submit); 6 pros fit maxSteps=64 with margin.
        -- quote_results is a newline-joined summary STRING (one line per pro). A string avoids
        -- the array/object serialization ambiguity an empty Lua table would hit at the schema.
        local results = args.quote_results or ""

        -- Record the pro we just finished (cands[idx], 1-based) before picking the next one.
        if idx > 0 then
          local prev = cands[idx] or {}
          local function nz(v) if v == nil or v == "" then return nil end return v end
          local open_err = nz(args.quote_error)
          local submit_status = nz(args.quote_submit_status)
          local submit_msg = nz(args.quote_submit_message)
          local submit_err = nz(args.quote_submit_error)
          local outcome
          if open_err then
            outcome = "FAILED to open/answer (" .. tostring(open_err) .. ")"
          elseif submit_msg then
            outcome = "Submitted -> Thumbtack error popover: \"" .. tostring(submit_msg) .. "\""
          elseif submit_status == "submitted" then
            outcome = "Submitted -> no error returned"
          elseif submit_status then
            outcome = "Submit attempted -> " .. tostring(submit_status) .. (submit_err and (" (" .. tostring(submit_err) .. ")") or "")
          elseif args.quote_reached_submit == true then
            outcome = "Reached final submit step (submit not attempted)"
          else
            outcome = "Stopped before submit (" .. tostring(args.quote_advance_reason or "no further auto-answer") .. ")"
          end
          local line = tostring(prev.name or "?") .. " [service_id " .. tostring(prev.service_id or "?") .. "]: " .. outcome
          results = (results ~= "" and (results .. "\n") or "") .. line
        end

        local limit = #cands
        if limit > MAX_OPEN then limit = MAX_OPEN end
        if idx < limit then
          local c = cands[idx + 1] or {}     -- Lua is 1-based; cands[idx+1] is the next unopened pro
          return {
            next = "open",
            quote_url = c.url,
            quote_target_service_id = c.service_id,
            quote_index = idx + 1,
            quote_results = results,
            -- clear per-pro signals so an open failure on the next pro can't inherit this result
            quote_error = "",
            quote_reached_submit = false,
            quote_answer_status = "",
            quote_status = "",
            quote_submit_status = "",
            quote_submit_message = "",
            quote_submit_error = "",
          }
        end
        return { next = "done", quote_index = idx, quote_results = results, quote_count = idx }
    parameters:
      type: object
      additionalProperties: true
      properties:
        candidates: { type: array }
        quote_index: { type: [integer, "null"] }
        quote_results: { type: [string, "null"] }
        quote_error: { type: [string, "null"] }
        quote_reached_submit: { type: [boolean, "null"] }
        quote_answer_status: { type: [string, "null"] }
        quote_status: { type: [string, "null"] }
        quote_advance_reason: { type: [string, "null"] }
        quote_submit_status: { type: [string, "null"] }
        quote_submit_message: { type: [string, "null"] }
        quote_submit_error: { type: [string, "null"] }

  cancel_quote_request:
    description: Record that the user declined or cancelled the quote request. Nothing is searched, opened, or sent.
    execute: { kind: runtime, implementation: passthrough }
    output:
      next: cancel
    parameters:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, "null"] }

  checkout_entry:
    description: Route a fresh checkout entry into the site handoff without a remote round trip.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute: { kind: runtime, implementation: lua, lua: 'return { next = "open" }' }
    parameters: { type: object, additionalProperties: true, properties: {} }

  site_entry:
    description: Route a fresh site-assistant entry into the site handoff without a remote round trip.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute: { kind: runtime, implementation: lua, lua: 'return { next = "open" }' }
    parameters: { type: object, additionalProperties: true, properties: {} }

  detect_cancellation:
    description: Decide whether the latest message is a standalone refusal rather than a request.
    # In-engine hop, deliberately not a remote command: a router entry's FIRST call cannot be a remote
    # one — the extension executes it and PUTs its result, the engine never consumes it, and the turn dies
    # on the tool deadline (measured at both 15s and 60s). See AGENTS.md §9.
    execute:
      kind: runtime
      implementation: lua
      lua: |-
        local text = type(args.requestText) == "string" and args.requestText or ""
        text = text:gsub("^%s+", ""):gsub("%s+$", "")
        if text == "" then return { next = "continue" } end
        local lowered = text:lower()
        local refusals = {
          "취소", "그만", "됐어", "됐습니다", "안 할래", "안할래", "관두",
          "cancel", "never mind", "nevermind", "no thanks", "stop"
        }
        local requests = {
          "찾아", "알아봐", "해줘", "요청해", "받아", "보여", "검색", "물어", "문의", "가능한", "업체",
          "정책", "find", "search", "show", "book", "policy"
        }
        local refusing = false
        for index = 1, #refusals do
          if lowered:find(refusals[index], 1, true) then refusing = true break end
        end
        if not refusing then return { next = "continue" } end
        -- A message that still ASKS for something is a request mentioning cancellation, not a refusal.
        for index = 1, #requests do
          if lowered:find(requests[index], 1, true) then return { next = "continue" } end
        end
        return { next = "cancel", cancelled_text = text }
    parameters:
      type: object
      additionalProperties: false
      properties:
        requestText: { type: [string, "null"] }

  browse_service_candidates:
    description: Rank, filter, window, and select searched Thumbtack pros deterministically from the site data.
    execute:
      kind: runtime
      implementation: lua
      # No rpc block: this command never touches the browser, so it is granted no ops.
      modules: ["_common.00_base", "_common.44_pagination", "_common.45_offer_view", "_common.46_candidate_browser", "_common.50_commerce_core", "_common.51_relevance", "_common.52_identity", "_common.53_verify", "_common.54_comparison", "_common.55_offers", "_common.56_store_io", "_common.63_pure_entries"]
      entry: run
      lua: |
        function run(args)
          return AX_RPC_PURE.run("AX_browse_service_candidates", args)
        end
    input:
      request_text: tool.args.requestText
      candidates: tool.args.candidates
      refine_request: tool.args.refine_request
      page_command: tool.args.page_command
      page_number: tool.args.page_number
      choice_numbers: tool.args.choice_numbers
      page: tool.args.view_page
    output:
      next: result.next
      shortlist: result.shortlist
      question: result.question
      shortlist_text: result.shortlist_text
      refine_selected: result.refine_selected
      refine_error: result.refine_error
      view_page: result.view_page
      view_pages: result.view_pages
      view_total: result.view_total
      refine_stage: criteria
      page_command: null
      page_number: null
      choice_numbers: null
      # The active criterion must survive the turn: clearing it made the next selection resolve against
      # the default ranking, so numbers from a sorted window picked different pros.
      refine_request: result.refine_request
    parameters:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        requestText: { type: [string, "null"] }
        candidates: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        refine_request: { type: [string, "null"] }
        page_command: { type: [string, "null"], enum: [next, prev, first, last, null] }
        page_number: { type: [integer, number, "null"] }
        choice_numbers: { type: [string, "null"] }
        view_page: { type: [integer, number, "null"] }

  select_pros:
    description: Replace the candidate list with the user-approved shortlist (refine_selected) and reset the quote loop index. No LLM, no navigation.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local sel = args.refine_selected or {}
        local list = {}
        for i = 1, #sel do
          local c = sel[i] or {}
          local url = c.url
          local sid = c.service_id
          if (url and url ~= "") or (sid and sid ~= "") then
            list[#list + 1] = { name = c.name, service_id = sid, url = url }
          end
        end
        if #list == 0 then
          return { next = "done" }
        end
        return { next = "pick", candidates = list, quote_index = 0, quote_results = "" }
    parameters:
      type: object
      additionalProperties: true
      properties:
        refine_selected: { type: [array, "null"] }

  open_quote:
    description: Navigate to the picked pro and open its "Request estimate" dialog. Never submits or sends.
    execute: { kind: remote, tool: AX_open_quote, timeoutMs: 60000 }
    input:
      url: tool.args.quote_url
      service_id: tool.args.quote_target_service_id
    output:
      next: { if: [{ var: result.error }, "error", "open"] }
      quote_status: result.status
      quote_service_id: result.service_id
      quote_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties:
        quote_url: { type: string }
        quote_target_service_id: { type: [string, "null"] }

  answer_quote:
    description: Answer the active Thumbtack request-flow step in auto mode and advance via Next/Continue/Skip. Never clicks Send/Submit/Get quotes; stops once the only remaining action is the final submit.
    execute: { kind: remote, tool: AX_answer_quote, timeoutMs: 60000 }
    input:
      auto: true
      user_requirements: tool.args.user_requirements
      email: tool.args.submit_email
      first_name: tool.args.submit_first_name
      last_name: tool.args.submit_last_name
      phone: tool.args.submit_phone
      zip_code: tool.args.zip_code
    output:
      next: { if: [{ var: result.error }, "error", { var: result.flow.reached_submit_step }, "submit", { "==": [{ var: result.flow.advance_reason }, "advance_button_not_found"] }, "submit", { "==": [{ var: result.flow.advance_reason }, "missing_answer"] }, "submit", "answer"] }
      quote_answer_status: result.status
      quote_advance_reason: result.flow.advance_reason
      quote_reached_submit: result.flow.reached_submit_step
      quote_error: result.error
    parameters:
      type: object
      additionalProperties: true
      properties:
        auto: { type: boolean }
        user_requirements: { type: [string, "null"] }
        submit_email: { type: [string, "null"] }
        submit_first_name: { type: [string, "null"] }
        submit_last_name: { type: [string, "null"] }
        submit_phone: { type: [string, "null"] }
        zip_code: { type: [string, "null"] }

  submit_quote:
    description: Click the final Submit on the active Thumbtack quote step with the collected contact details (first/last name, email, phone); returns the resulting Thumbtack popover/outcome text.
    execute: { kind: remote, tool: AX_submit_quote, timeoutMs: 60000 }
    input:
      confirm: true
      phone: tool.args.submit_phone
      email: tool.args.submit_email
      first_name: tool.args.submit_first_name
      last_name: tool.args.submit_last_name
      zip_code: tool.args.zip_code
    output:
      next: { if: [{ var: result.flow_error }, "done", "done"] }
      quote_submit_status: result.status
      quote_submit_message: { if: [{ var: result.message }, { var: result.message }, { var: result.request_error.message }] }
      quote_submit_error: result.flow_error
    effect: mutation
    consent: required
    idempotent: true
    require: { quote_reached_submit: true }
    parameters:
      type: object
      additionalProperties: true
      properties:
        zip_code: { type: [string, "null"] }
        submit_phone: { type: [string, "null"] }
        submit_email: { type: [string, "null"] }
        submit_first_name: { type: [string, "null"] }
        submit_last_name: { type: [string, "null"] }
