  shopping_rank_store_offers:
    description: Rank model-screened, identity-bound candidates while preserving
      failures and cost coverage.
    execute:
      kind: runtime
      implementation: lua
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.73_rpc_offers"
        ]
      rpc:
        # These three touch no page: ranking, windowing and refinement are arithmetic over a snapshot.
        # The compiler refuses an empty allow-list, so this names the cheapest read there is and the
        # script never calls it.
        allow: [ dom.get_location_href ]
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_OFFERS.rank(args)
        end
    output:
      next: result.next
      failures: result.failures
      comparison_id: result.comparison_id
      comparison_approval: current_comparison
      # The listing itself, as one string. `state: session` in the runtime is keyed by (session, TOOL),
      # so this is the only channel from the turn that BUILT the comparison to the turn that pages it.
      # No model node selects it, so it costs nothing in a prompt (`inputSelector` is an allowlist).
      comparison_state: result.comparison_state
      comparison_text: result.question
      store_status: result.store_status
      incomplete_count: result.incomplete_count
      # `complete_count` and `base_currency` were mapped here and declared by NO flow state key, so they
      # wrote nowhere and the command's values were unreachable. The window already states both facts in
      # its own text. Deleted rather than forwarded: a key nothing reads is not a contract.
      view_page: result.view_page
      view_pages: result.view_pages
      view_total: result.view_total
    parameters:
      type: object
      additionalProperties: false
      required: [ verified_offers, identity_id ]
      properties:
        verified_offers: { type: array, items: { type: object, additionalProperties: true } }
        failures:
          {
            type: [ array, "null" ],
            items: { type: object, additionalProperties: true }
          }
        identity_id: { type: string, minLength: 1 }
        quantity: { type: [ integer, number ] }
        screened_out: { type: [ integer, number, "null" ] }

  present_store_offers:
    description: Retrieve the exact current comparison and force a separate approval
      turn before selection.
    execute:
      kind: runtime
      implementation: lua
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.73_rpc_offers"
        ]
      rpc:
        # These three touch no page: ranking, windowing and refinement are arithmetic over a snapshot.
        # The compiler refuses an empty allow-list, so this names the cheapest read there is and the
        # script never calls it.
        allow: [ dom.get_location_href ]
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_OFFERS.present(args)
        end
    output:
      # The SCRIPT picks the branch now: `ask` on the pass that renders and pauses, `answer` on the one
      # that steps aside for the reply. This used to read `tool.args.next` — the model's argument — and a
      # contract node has no model, so it answered `undefined` and every comparison routed to lost.
      next: result.next
      question: result.question
      choice_stage: result.choice_stage
      error: result.error
      view_page: result.view_page
      view_pages: result.view_pages
      view_total: result.view_total
      # The branch payload. `page`/`select`/`refine` mean nothing without which page, which number, which
      # words — published only `next`, the refiner was told to page with nothing to page with and the
      # resolver was told to select with no index.
      comparison_id: result.comparison_id
      page_command: result.page_command
      page_number: result.page_number
      refine_request: result.refine_request
      choice_index: result.choice_index
      choice_comparison_id: result.choice_comparison_id
      identity_change_request: result.identity_change_request
    parameters:
      type: object
      additionalProperties: false
      # Nothing is required: this is projected from flow state, and the first pass has no `choice_stage`
      # at all. A `required` key that state does not carry is REJECTED before the script runs.
      required: []
      properties:
        # The user's answer to the window. Declared because UNDECLARED IS DROPPED: selected but never
        # declared, "취소" never reached the script and the same listing came back instead of stopping.
        requestText: { type: [ string, "null" ] }
        userMessages: { type: [ array, "null" ], items: { type: string } }
        choice_stage: { type: [ string, "null" ] }
        comparison_id: { type: [ string, "null" ] }
        view_page: { type: [ integer, number, "null" ] }
        # The listing itself, carried between turns. Declared because UNDECLARED IS DROPPED — the runtime
        # projects an action_contract's arguments through this schema, and an `input:` block on a runtime
        # tool is a compile error. Nullable and not required: the first pass has no listing yet.
        comparison_state: { type: [ string, "null" ] }

  shopping_invalidate_identity_selection:
    description: Carry one identity-change request across the state-clear boundary.
    execute:
      kind: runtime
      implementation: lua
      entry: run
      lua: |
        function run(args)
