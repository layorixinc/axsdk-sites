        exploration_query: { type: string, minLength: 1 }
        identity_change_request: { type: string, minLength: 1 }
        identity_revision: { type: [ integer, number, "null" ] }
        discovery_sites: { type: [ array, "null" ], items: { type: object, additionalProperties: true } }
        product_category: { type: [ string, "null" ] }
        requested_brand: { type: [ string, "null" ] }
        query_variants: { type: [ string, "null" ] }
        brand_aliases: { type: [ string, "null" ] }
        hard_constraints: { type: [ object, "null" ], additionalProperties: true }
        soft_preferences: { type: [ object, "null" ], additionalProperties: true }

  shopping_refine_store_offers:
    description: Move the comparison window, or filter and sort the listing, from
      the user's own words.
    execute:
      kind: runtime
      implementation: lua
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.73_rpc_offers"
        ]
      rpc:
        # These three touch no page: ranking, windowing and refinement are arithmetic over a snapshot.
        # The compiler refuses an empty allow-list, so this names the cheapest read there is and the
        # script never calls it.
        allow: [ dom.get_location_href ]
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_OFFERS.refine(args)
        end
    output:
      next: result.next
      # A refinement that reissues the listing MUST write the new snapshot back; leaving the old one in
      # state would page a listing the user is no longer looking at.
      comparison_state: result.comparison_state
      question: result.question
      comparison_id: result.comparison_id
      store_status: result.store_status
      view_sort: result.view_sort
      refine_error: result.refine_error
      view_page: result.view_page
      view_pages: result.view_pages
      view_total: result.view_total
      requestText: result.rescope_request
      # A browsing turn always reopens the presentation gate: the next approval turn must show the new
      # window before it may accept a number against it.
      choice_stage: null
      choice_index: null
      choice_comparison_id: null
      page_command: null
      page_number: null
      refine_request: null
    parameters:
      type: object
      additionalProperties: false
      required: [ comparison_id ]
      properties:
        comparison_id: { type: string, minLength: 1 }
        # The listing itself, carried between turns. Declared because UNDECLARED IS DROPPED — the runtime
        # projects an action_contract's arguments through this schema, and an `input:` block on a runtime
        # tool is a compile error. Nullable and not required: the first pass has no listing yet.
        comparison_state: { type: [ string, "null" ] }
        failures:
          {
            type: [ array, "null" ],
            items: { type: object, additionalProperties: true }
          }
        identity_id: { type: [ string, "null" ] }
        view_page: { type: [ integer, number, "null" ] }
        view_sort: { type: [ string, "null" ] }
        page_command: { type: [ string, "null" ], enum: [ next, prev, first, last, null ] }
        page_number: { type: [ integer, number, "null" ] }
        refine_request: { type: [ string, "null" ] }

  shopping_resolve_store_offer:
    description: Validate a ranked offer and current comparison snapshot, then emit
      scoped mutation approvals.
    execute:
      kind: runtime
      implementation: lua
      # No rpc block: this command never touches the browser, so it is granted no ops.
      modules:
        [
          "_common.00_base",
          "_common.44_pagination",
          "_common.45_offer_view",
          "_common.46_candidate_browser",
          "_common.50_commerce_core",
          "_common.51_relevance",
          "_common.52_identity",
          "_common.53_verify",
          "_common.54_comparison",
          "_common.55_offers",
          "_common.56_store_io",
          "_common.63_pure_entries",
          "_common.73_rpc_offers"
        ]
      entry: run
      lua: |
        function run(args)
          -- Through the snapshot, which is the only channel the listing travels on. Reading a separate
          -- `offers` state field answered `expected array, received null` live, because an empty list is
          -- carried as absent now — and two channels can disagree about WHICH offers were numbered.
          return AX_RPC_OFFERS.resolve(args)
        end
    output:
      next: result.next
      selection_error: result.error
      selected_offer: result.selected_offer
      selected_rank: result.selected_rank
      site: result.site
      product_id: result.product_id
      product_name: result.product_name
      quantity: result.quantity
      expected_unit_price: result.expected_unit_price
      expected_currency: result.expected_currency
      expected_identity_model: result.expected_identity_model
      approved_total_base: result.approved_total_base
      identity_id: result.identity_id
      comparison_id: result.comparison_id
      identity_approval: result.identity_approval
      comparison_approval: result.comparison_approval
      cart_approval: result.cart_approval
      # A refused number must not be read again. The presenter interprets `requestText`, so leaving it in
      # place would re-select the same invalid number the moment the window comes back.
      requestText: null
      choice_index: null
    parameters:
      type: object
      additionalProperties: false
      # `offers` is gone: the listing arrives in the snapshot. What stays required is the number and the
      # id that gives it meaning.
      required: [ choice_index, choice_comparison_id ]
      properties:
        choice_index: { type: [ integer, number ] }
        choice_comparison_id: { type: [ string, "null" ] }
        comparison_id: { type: string, minLength: 1 }
        # The listing itself, carried between turns. Declared because UNDECLARED IS DROPPED — the runtime
        # projects an action_contract's arguments through this schema, and an `input:` block on a runtime
        # tool is a compile error. Nullable and not required: the first pass has no listing yet.
        comparison_state: { type: [ string, "null" ] }
        identity_id: { type: string, minLength: 1 }
        choice_stage: { type: string, enum: [ asked ] }
        quantity: { type: [ integer, number ] }

  shopping_add_selected_store_offer:
    description: Revalidate product identity and price, then add only the explicitly
      selected current offer. Never checks out or orders.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.61_rpc_storefront", "_common.62_rpc_sites", "_common.67_rpc_cart" ]
      rpc:
        # Everything the cart needs and nothing else: no form submit, and no way to reach a checkout.
        allow:
          [
            nav.navigate,
            dom.get_location_href,
            dom.exists,
            dom.get_text,
            dom.get_attr,
            dom.click,
            dom.set_value
          ]
        opTimeoutMs: 2000
        deadlineMs: 120000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_CART.add_to_cart(args)
        end
    output:
      # There is no `navigating` branch any more: one call navigates, revalidates, adds and confirms. The
      # durable adapter needed three of them because each navigation destroyed its context.
      next: result.next
      cart_status: { if: [ { var: result.added }, "added", "failed" ] }
      cart_error:
        {
          if: [ { var: result.login_required }, "login_required", { var: result.error } ]
        }
      cart_confirmation: result.confirmation
      cart_url: result.cart_url
      # WHERE it stopped, for the same reason the single-site add publishes it: one word for four facts
      # is what left `TODO.md` §19 unattributable on a live trace.
      cart_stage: result.stage
    effect: mutation
    consent: required
    idempotent: true
    require:
      cart_approval: user_selected_compared_offer
      identity_approval: locked_product_identity
      comparison_approval: current_comparison
    parameters:
      type: object
      additionalProperties: false
      required:
        [
          site,
          product_id,
          identity_id,
          comparison_id,
          identity_approval,
          comparison_approval,
          cart_approval
        ]
      properties:
        site:
          {
            type: string,
            enum:
              [
                amazon,
                walmart,
                ebay,
                aliexpress,
                etsy,
                coupang,
                naver-shopping,
                gmarket,
                11st,
                ssg
              ]
          }
        product_id: { type: string, minLength: 1 }
        quantity: { type: [ integer, number ] }
        expected_unit_price: { type: [ number, "null" ] }
        expected_currency: { type: [ string, "null" ] }
        expected_identity_model: { type: [ string, "null" ] }
        identity_id: { type: string, minLength: 1 }
        comparison_id: { type: string, minLength: 1 }
        # The listing itself, carried between turns. Declared because UNDECLARED IS DROPPED — the runtime
        # projects an action_contract's arguments through this schema, and an `input:` block on a runtime
        # tool is a compile error. Nullable and not required: the first pass has no listing yet.
        identity_approval: { type: string, enum: [ locked_product_identity ] }
        comparison_approval: { type: string, enum: [ current_comparison ] }
        cart_approval: { type: string, enum: [ user_selected_compared_offer ] }
  decide:
    description: Select configured intent flows and initial runtime state for the
      config-runtime planner.
    parameters:
      type: object
      additionalProperties: false
      required: [ action, intents ]
      properties:
        set: { type: boolean }
        action:
          {
            type: string,
            enum: [ continue_current, replace_current, clarify, out_of_scope ]
          }
        intents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ intent, segments, state ]
            properties:
              intent:
                {
                  type: string,
                  enum:
                    [
                      request_service_quote,
                      shopping_single_site,
                      shopping_multi_store_total_cost,
                      end_conversation,
                      checkout,
                      memory,
                      cart_remove_item,
                      community_script
                    ]
                }
              segments:
                type: array
                minItems: 1
                items: { type: string }
              state:
                type: object
                additionalProperties: false
                required: [ requestText ]
                properties:
                  requestText: { type: string, minLength: 1 }
                  followup:
                    type: object
                    additionalProperties: true
                    required: [ type, question ]
                    properties:
                      type: { type: string, enum: [ info_question ] }
                      question: { type: string, minLength: 1 }
                      topic: { type: string, minLength: 1 }
                      scope: { type: string, enum: [ active_state ] }
        question: { type: string }
        conversationSummary: { type: string }
        latestMessageInterpretation: { type: string }
        reason: { type: string }

  plan_memory:
    description: Plan one explicit memory operation and project its exact arguments
      into flow state.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: false
      required: [ next, operation ]
      properties:
        next: { type: string, enum: [ list, get, search, find_delete, delete, set, error ] }
        operation: { type: string, enum: [ list, get, search, delete, set, delete_candidates ] }
        key: { type: string, minLength: 1 }
        regex: { type: string, minLength: 1, maxLength: 200 }
        delete_keys:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        confirmed: { type: boolean }
        memory_entries:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ key, value ]
            properties:
              key: { type: string, minLength: 1 }
              value: { type: string }

  prepare_memory:
    description: Convert validated key/value entries into one bulk memory map.
    execute:
      kind: runtime
      implementation: lua
      lua: |
        local entries = args.memory_entries or {}
        local memory = {}
        local count = 0
        for i = 1, #entries do
          local entry = entries[i] or {}
          local key = entry.key
          local value = entry.value
          if type(key) ~= "string" or key == "" or type(value) ~= "string" then
            return { next = "error", error = "invalid memory entry" }
          end
          memory[key] = value
          count = count + 1
        end
        if count == 0 then
          return { next = "error", error = "memory entries are empty" }
        end
        return { next = "set", memory = memory, confirmed = true }
    parameters:
      type: object
      additionalProperties: false
      required: [ memory_entries ]
      properties:
        memory_entries:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ key, value ]
            properties:
              key: { type: string, minLength: 1 }
              value: { type: string }

  list_memory:
    description: List all saved memory keys.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.get ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.get(args)
        end
    output:
      next: { if: [ { var: result.error }, "error", "report" ] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: true

  get_memory:
    description: Read one exact saved memory key.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.get ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.get(args)
        end
    output:
      next: { if: [ { var: result.error }, "error", "report" ] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: false
      required: [ key ]
      properties:
        key: { type: string, minLength: 1 }

  search_memory:
    description: Search saved memory with one case-insensitive regex and return
      bounded Markdown.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.search ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.search(args)
        end
    output:
      next: { if: [ { var: result.ok }, "report", "error" ] }
      memory_result: result
    parameters:
      type: object
      additionalProperties: false
      required: [ regex ]
      properties:
        regex: { type: string, minLength: 1, maxLength: 200 }

  find_delete_candidates:
    description: Find exact memory key candidates for an explicit category deletion request.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.search ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.search(args)
        end
    output:
      # `AX_RPC_MEMORY.search` answers `memory_result.matches = { { key, excerpt, truncated }, … }` — the
      # shape `recall_saved_contact` reads and was live-verified against. This branched on `result.keys.0`,
      # which the script has never produced, so EVERY successful search took `not_found` and a category
      # deletion could not reach its chooser while matches existed. The stale shape is in MEMORY_DESIGN.md
      # §19.5, from when these were `kind: remote` adapters carrying top-level `keys`.
      next:
        if:
          - { var: result.ok }
          - { if: [ { var: result.memory_result.matches.0 }, "choose", "not_found" ] }
          - "error"
      # The op's own answer, not the script's envelope around it: `result` published
      # `{next, ok, memory_result}` so every declared consumer path sat one level too deep.
      memory_result: result.memory_result
    parameters:
      type: object
      additionalProperties: false
      required: [ regex ]
      properties:
        regex: { type: string, minLength: 1, maxLength: 200 }

  choose_delete_keys:
    description: Ask for or resolve one or more exact memory keys to delete.
    execute:
      kind: runtime
      implementation: passthrough
    output: tool.args
    parameters:
      type: object
      additionalProperties: false
      required: [ next, question, delete_keys, confirmed ]
      properties:
        next: { type: string, enum: [ ask, delete, cancelled, error ] }
        question: { type: [ string, "null" ] }
        delete_keys:
          type: array
          items: { type: string }
        confirmed: { type: boolean }

  delete_memory:
    description: Delete one or more exact GLOBAL memory keys selected by the user.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.set_bulk ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.delete(args)
        end
    output:
      next: { if: [ { var: result.ok }, "report", "error" ] }
      memory_result: result
      delete_keys: result.delete_keys
    effect: mutation
    consent: required
    idempotent: true
    require: { confirmed: true }
    parameters:
      type: object
      additionalProperties: false
      required: [ delete_keys, confirmed ]
      properties:
        delete_keys:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        confirmed: { type: boolean }

  set_memory:
    description: Set final memory values in one call. Non-empty Markdown saves; an
      empty string deletes.
    execute:
      kind: runtime
      implementation: lua
      modules: [ "_common.70_rpc_memory" ]
      rpc:
        allow: [ memory.set_bulk ]
        opTimeoutMs: 2000
        deadlineMs: 30000
      entry: run
      lua: |
        function run(args)
          return AX_RPC_MEMORY.set_bulk(args)
        end
    output:
      next: { if: [ { var: result.ok }, "report", "error" ] }
      memory_result: result
      memory: result.memory
    effect: mutation
    consent: required
    idempotent: true
    require: { confirmed: true }
    parameters:
      type: object
      additionalProperties: false
      required: [ memory, confirmed ]
      properties:
        confirmed: { type: boolean }
